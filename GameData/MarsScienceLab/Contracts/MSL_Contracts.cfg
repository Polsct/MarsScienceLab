// Mars Science Laboratory career contracts (Contract Configurator 2.x). Text is localization keys; MSLContractText
// translates them before Contract Configurator reads this file.
//   MSL_Landing  fly the MSL stack to the target body and land Curiosity anywhere on it
//   MSL_Surface  after MSL_Landing: transmit the first surface science (ChemCam, MAHLI, APXS, CheMin, SAM)
// Target body: Duna in the stock system, Mars with RealSolarSystem (patch at the end). Rewards scale with the home
// world radius (20 funds per km). No waypoints: Contract Configurator cannot place them near the landed rover.

CONTRACT_GROUP
{
    name = MSL
    displayName = #MSL_Aeroshell_Contract_group
    agent = Probodobodyne Inc
    minVersion = 2.0.0
    maxSimultaneous = 1

    DATA
    {
        type = CelestialBody
        mslBody = Duna
    }

    DATA
    {
        type = double
        unit = HomeWorld().Radius() / 1000 * 20
    }
}

CONTRACT_TYPE
{
    name = MSL_Landing
    group = MSL
    agent = Probodobodyne Inc
    title = #MSL_Aeroshell_Contract_landing_title
    description = #MSL_Aeroshell_Contract_landing_description
    synopsis = #MSL_Aeroshell_Contract_landing_synopsis
    completedMessage = #MSL_Aeroshell_Contract_landing_completed
    notes = #MSL_Aeroshell_Contract_landing_notes

    targetBody = @MSL:mslBody
    maxCompletions = 1
    maxSimultaneous = 1

    advanceFunds = @MSL:unit * 5
    rewardFunds = @MSL:unit * 15
    rewardScience = 50
    rewardReputation = 40
    failureReputation = 20

    REQUIREMENT
    {
        name = CuriosityUnlocked
        type = PartUnlocked
        part = MSL.Curiosity
    }
    REQUIREMENT
    {
        name = SkyCraneUnlocked
        type = PartUnlocked
        part = MSL.SkyCrane
    }

    // the launched MSL stack: rover inside, on its cruise stage, reaching the target body's sphere of influence
    PARAMETER
    {
        name = Cruise
        type = VesselParameterGroup
        title = #MSL_Aeroshell_Contract_landing_cruise
        define = MSL Stack
        PARAMETER
        {
            name = HasRover
            type = PartValidation
            part = MSL.Curiosity
            hidden = true
        }
        PARAMETER
        {
            name = HasCruise
            type = PartValidation
            part = MSL.CruiseStage
            hidden = true
        }
        PARAMETER
        {
            name = Arrive
            type = ReachState
            targetBody = @/targetBody
            disableOnStateChange = true
            hidden = true
        }
    }

    // Curiosity on the ground anywhere on the target body for 10 s (a one-frame LANDED would otherwise count)
    PARAMETER
    {
        name = Landed
        type = VesselParameterGroup
        title = #MSL_Aeroshell_Contract_landing_landed
        completeInSequence = true
        duration = 10s
        PARAMETER
        {
            name = Rover
            type = PartValidation
            part = MSL.Curiosity
            hidden = true
        }
        PARAMETER
        {
            name = OnGround
            type = ReachState
            targetBody = @/targetBody
            situation = LANDED
            hidden = true
        }
    }
}

CONTRACT_TYPE
{
    name = MSL_Surface
    group = MSL
    agent = Probodobodyne Inc
    title = #MSL_Aeroshell_Contract_surface_title
    description = #MSL_Aeroshell_Contract_surface_description
    synopsis = #MSL_Aeroshell_Contract_surface_synopsis
    completedMessage = #MSL_Aeroshell_Contract_surface_completed

    targetBody = @MSL:mslBody
    maxCompletions = 1
    maxSimultaneous = 1

    rewardFunds = @MSL:unit * 6
    rewardScience = 30
    rewardReputation = 20

    REQUIREMENT
    {
        name = Landed
        type = CompleteContract
        contractType = MSL_Landing
    }

    // the instruments of the first drill campaign, run on the ground; the rover sends its data home
    PARAMETER
    {
        name = ChemCam
        type = CollectScience
        targetBody = @/targetBody
        situation = SrfLanded
        experiment = MSL_ChemCam
        recoveryMethod = Transmit
    }
    PARAMETER
    {
        name = MAHLI
        type = CollectScience
        targetBody = @/targetBody
        situation = SrfLanded
        experiment = MSL_MAHLI
        recoveryMethod = Transmit
    }
    PARAMETER
    {
        name = APXS
        type = CollectScience
        targetBody = @/targetBody
        situation = SrfLanded
        experiment = MSL_APXS
        recoveryMethod = Transmit
    }
    PARAMETER
    {
        name = CheMin
        type = CollectScience
        targetBody = @/targetBody
        situation = SrfLanded
        experiment = MSL_CheMin
        recoveryMethod = Transmit
    }
    PARAMETER
    {
        name = SAM
        type = CollectScience
        targetBody = @/targetBody
        situation = SrfLanded
        experiment = MSL_SAM
        recoveryMethod = Transmit
    }
}

// RealSolarSystem: the real target
@CONTRACT_GROUP[MSL]:NEEDS[RealSolarSystem]
{
    @DATA:HAS[#mslBody]
    {
        @mslBody = Mars
    }
}
