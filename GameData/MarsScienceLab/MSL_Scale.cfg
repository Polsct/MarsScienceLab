// Size of the MSL parts outside RealSolarSystem (MSLAeroshell.dll, MSLScale.cs).
//   scale = auto     from the home world radius: 0.625 x on stock Kerbin (600 km), 0.76 x on JNSQ or quarter-scale
//                    Sol (1600 km), 0.83 x on KSRSS (2548 km), 1:1 on a real-size Earth
//   scale = 0.8      a fixed size instead (0.2 .. 2). Masses, thrust and areas follow the square, so the entry,
//                    T/W and delta-v stay those of the real vehicle at any size.
// With RealSolarSystem the parts are always 1:1. The shipped craft are written at the chosen size as
// Ships/VAB/MSL_Guided_Entry_Scaled.craft and MSL_Curiosity_2012_Scaled.craft (not needed at 0.625 x: *_Stock.craft).
MSL_SCALE
{
    scale = auto
}
