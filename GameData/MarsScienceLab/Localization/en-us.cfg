        // MSL_Curiosity
        #MSL_Curiosity_MSL_Curiosity_title = MSL Curiosity Rover
        #MSL_Curiosity_MSL_Curiosity_description = Curiosity rover: 899 kg, 2.9 × 2.7 × 2.2 m. Six wheels on rocker-bogie suspension, which also served as landing gear.
        #MSL_Curiosity_MSL_Curiosity_manufacturer = NASA JPL
        #MSL_Curiosity_MSL_Curiosity_tags = curiosity msl rover science mars
        #MSL_Curiosity_Review_data = Review data
        #MSL_Curiosity_Collect_data = Collect data
        #MSL_Curiosity_MSL_SAM_result = Heated soil sample: water, carbon dioxide and trace organics.
        #MSL_Curiosity_MSL_SAM_result_polar = Ice-rich sample: a large water release on heating, then oxygen from perchlorates.
        #MSL_Curiosity_MSL_SAM_result_volcanic = Basaltic sample: little water and almost no carbon; sulfur dioxide from sulfates.
        #MSL_Curiosity_MSL_SAM_result_canyon = Layered canyon sediment: water from hydrated sulfates and a trace of organic carbon.
        #MSL_Curiosity_MSL_SAM_result_basin = Lake-bed mudstone: water from clays, carbon dioxide and chlorinated organic molecules.
        #MSL_Curiosity_MSL_SAM_result_plains = Wind-blown soil: water from amorphous material, oxygen from perchlorates.
        #MSL_Curiosity_MSL_SAM_result_highlands = Ancient crust: modest water, carbon dioxide from carbonates and trace organics.
        #MSL_Curiosity_MSL_CheMin_result = X-ray diffraction: clay minerals in the sample.
        #MSL_Curiosity_MSL_CheMin_result_polar = Diffraction pattern dominated by water ice, with fine dust minerals mixed in.
        #MSL_Curiosity_MSL_CheMin_result_volcanic = Plagioclase, pyroxene and olivine: fresh basalt with little alteration.
        #MSL_Curiosity_MSL_CheMin_result_canyon = Gypsum, jarosite and hematite: rock laid down and altered by acidic water.
        #MSL_Curiosity_MSL_CheMin_result_basin = Smectite clays and magnetite: sediment deposited in calm, near-neutral water.
        #MSL_Curiosity_MSL_CheMin_result_plains = Mostly basaltic minerals plus a large amorphous fraction from global dust.
        #MSL_Curiosity_MSL_CheMin_result_highlands = Phyllosilicates and carbonates: crust altered by water early in the planet's history.
        #MSL_Curiosity_MSL_DAN_result = Hydrogen in the top 1 m, mostly water bound in minerals.
        #MSL_Curiosity_MSL_DAN_result_polar = Very strong neutron suppression: ice makes up much of the ground below.
        #MSL_Curiosity_MSL_DAN_result_volcanic = Very little hydrogen: dry volcanic rock.
        #MSL_Curiosity_MSL_DAN_result_canyon = Patchy hydrogen: hydrated minerals in the exposed layers.
        #MSL_Curiosity_MSL_DAN_result_basin = Raised hydrogen in the crater floor: water bound in clays.
        #MSL_Curiosity_MSL_DAN_result_plains = A few percent water-equivalent hydrogen, rising with depth.
        #MSL_Curiosity_MSL_DAN_result_highlands = Hydrogen near the global average: water held in altered minerals.
        #MSL_Curiosity_MSL_RAD_result = Surface dose from cosmic rays and solar particles recorded.
        #MSL_Curiosity_MSL_RAD_result_polar = Dose near the planetary average; the polar night does not change the cosmic-ray flux.
        #MSL_Curiosity_MSL_RAD_result_volcanic = Highest surface dose: the thin air above the volcano gives almost no shielding.
        #MSL_Curiosity_MSL_RAD_result_canyon = Lower dose on the canyon floor: thicker air overhead and walls blocking part of the sky.
        #MSL_Curiosity_MSL_RAD_result_basin = Reduced dose: the deep basin lies under more atmosphere.
        #MSL_Curiosity_MSL_RAD_result_plains = Galactic cosmic-ray dose, with a short dip as a solar storm passed.
        #MSL_Curiosity_MSL_RAD_result_highlands = Dose slightly above average at this elevation; neutrons from the ground recorded.
        #MSL_Curiosity_MSL_REMS_result = One sol of weather: cold, dry, very low pressure.
        #MSL_Curiosity_MSL_REMS_result_polar = Bitterly cold: carbon dioxide frost forms at night.
        #MSL_Curiosity_MSL_REMS_result_volcanic = Pressure far below average on the volcano; a huge day-night temperature swing.
        #MSL_Curiosity_MSL_REMS_result_canyon = Higher pressure on the canyon floor; slope winds reverse every morning and evening.
        #MSL_Curiosity_MSL_REMS_result_basin = Among the highest pressures on the planet; heavy frost at dawn.
        #MSL_Curiosity_MSL_REMS_result_plains = Dust devils pass the rover, each one a sharp dip in pressure.
        #MSL_Curiosity_MSL_REMS_result_highlands = Dry, cold and windy; the ground temperature swings by over 80 °C in a sol.
        #MSL_Curiosity_MSL_MAHLI_result = Close-up color images, single sand grains resolved.
        #MSL_Curiosity_MSL_MAHLI_result_polar = Layers of ice and dust under the lens, banded like tree rings.
        #MSL_Curiosity_MSL_MAHLI_result_volcanic = Vesicles and dark glassy crystals in the basalt surface.
        #MSL_Curiosity_MSL_MAHLI_result_canyon = Fine laminae, with white mineral veins cutting across the layers.
        #MSL_Curiosity_MSL_MAHLI_result_basin = Smooth mudstone with sulfate veins and tiny concretions.
        #MSL_Curiosity_MSL_MAHLI_result_plains = Rounded sand grains and a dust-coated ripple crest.
        #MSL_Curiosity_MSL_MAHLI_result_highlands = Rounded pebbles in a conglomerate: stones once carried by flowing water.
        #MSL_Curiosity_MSL_APXS_result = Elemental composition of the target from alpha-particle and X-ray spectra.
        #MSL_Curiosity_MSL_APXS_result_polar = Ice-dominated target: low counts, mostly from the dust coating.
        #MSL_Curiosity_MSL_APXS_result_volcanic = Iron- and magnesium-rich basalt, low in volatiles.
        #MSL_Curiosity_MSL_APXS_result_canyon = High sulfur and calcium: sulfate-cemented layers.
        #MSL_Curiosity_MSL_APXS_result_basin = Raised chlorine and bromine: salts left by evaporating water.
