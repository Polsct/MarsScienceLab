// MSL parachute closeout cone lid + mortar: the PCC lid (Acusil II TPS on a graphite/Al-honeycomb
// sandwich, PLGA radome window, six retention fasteners) and the mortar that fires the DGB pack through it (aluminium
// canister, breech, initiators). This part is the parachute: Patches/MSL_Parachute.cfg adds the parachute module
// (RealChute when installed), the DGB canopy model, the risers and the pack mass to it.
// Part frame: origin on the axis at the top of the initiators (the forward end, on the PSS), +Y forward into the
// backshell. Locked pose on the backshell node 'mortar' (ModuleMSLComponentMount): rotate / offset are undone.
// A physical part: the canopy load goes through its joint on the mortar node into the backshell. When the mortar
// fires the parachute module hides this part's PCC_Lid (capName).
PART
{
	name = MSL_AS_Parachute
	module = Part
	author = Polsct
	MODEL
	{
		model = MarsScienceLab/Assets/MSL_AS_Parachute
	}
	rescaleFactor = 1 // true 1:1 geometry; no rescale
	scale = 1
	node_stack_top = 0.0000, 0.0000, 0.0000, 0.0000, 1.0000, 0.0000, 1 // onto the backshell's mortar node
	attachRules = 1,0,0,0,0
	TechRequired = advLanding
	entryCost = 2000
	cost = 400 // [GAME]
	category = Utility
	subcategory = 0
	manufacturer = #MSL_Aeroshell_MSL_Backshell_manufacturer
	title = #MSL_Aeroshell_MSL_AS_Parachute_title
	description = #MSL_Aeroshell_MSL_AS_Parachute_description
	mass = 0.0189 // lid 4.0 kg + mortar 14.9 kg, modelled volume x density (estimate); pack mass: parachute module
	CoMOffset = -0.0027, -0.2438, 0.0000
	dragModelType = default
	maximum_drag = 0.01
	minimum_drag = 0.01
	angularDrag = 0.2
	crashTolerance = 12
	breakingForce = 2000 // as the backshell: the joint on the mortar node carries the parachute load
	breakingTorque = 2000
	maxTemp = 2400 // [GAME] as the backshell
	skinMaxTemp = 2000 // [GAME]
	emissiveConstant = 0.8 // [GAME]
	fuelCrossFeed = True
	bulkheadProfiles = srf
	tags = #MSL_Aeroshell_MSL_AS_Parachute_tags
	MODULE
	{
		name = ModuleMSLComponentMount // editor: locks the measured pose on attach (rotate / offset undone)
		parentPart = MSL_Backshell
		mounts = mortar:0 0 0 1
	}
}
@PART[MSL_AS_Parachute]:NEEDS[RealismOverhaul]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
	@maxTemp = 2400
	%skinMaxTemp = 2000
}
@PART[MSL_AS_Parachute]:NEEDS[RealSolarSystem]:LAST[MarsScienceLab]
{
	@rescaleFactor = 1
	@scale = 1
	!MODULE[TweakScale] {}
}
@PART[MSL_AS_Parachute]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	@MODULE[GeometryPartModule]
	{
		%forceUseColliders = True
	}
}
// RealChute lists parachutes in its own Filter by Function subcategory and takes them out of Utility (category none);
// MSLPartCategory gives this part the module info that subcategory picks.
@PART[MSL_AS_Parachute]:NEEDS[RealChute]:FOR[MarsScienceLab]
{
	@category = none
}
