// Curiosity component part. Physicsless; mounted inside the
// rover model by ModuleCuriosityComponent, driven by the rover's ModuleCuriosityRig.
PART
{
    name = MSL_Curiosity_Arm
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_Curiosity_Arm
        scale = 1,1,1
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 1.1128509, 0.998050034, 0.45149979, 0, 1, 0, 0
    TechRequired = experimentalScience
    entryCost = 0
    cost = 1000
    category = Science
    subcategory = 0
    title = #MSL_Curiosity_MSL_Curiosity_Arm_title
    manufacturer = #MSL_Curiosity_MSL_Curiosity_Arm_manufacturer
    description = #MSL_Curiosity_MSL_Curiosity_Arm_description
    tags = #MSL_Curiosity_MSL_Curiosity_Arm_tags
    attachRules = 1,0,1,0,1
    bulkheadProfiles = srf
    mass = 0.0400
    PhysicsSignificance = 1
    crashTolerance = 8
    maxTemp = 1000
    breakingForce = 200
    breakingTorque = 200
    MODULE
    {
        name = ModuleCuriosityComponent
        link = Arm_Azimuth
        mountPosition = 0, 0, 0
    }
    MODULE
    {
        name = ModuleCuriosityExperiment
        experimentID = MSL_MAHLI
        requires = arm
        experimentActionName = #MSL_Curiosity_MAHLI_close_up
        resetActionName = #MSL_Curiosity_Reset_MSL_MAHLI
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        xmitDataScalar = 0.5
        dataIsCollectable = True
        collectActionName = #MSL_Curiosity_Collect_data
        rerunnable = True
        interactionRange = 1.5
    }
    MODULE
    {
        name = ModuleCuriosityExperiment
        experimentID = MSL_APXS
        requires = arm
        experimentActionName = #MSL_Curiosity_APXS_elemental_analysis
        resetActionName = #MSL_Curiosity_Reset_MSL_APXS
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        xmitDataScalar = 0.5
        dataIsCollectable = True
        collectActionName = #MSL_Curiosity_Collect_data
        rerunnable = True
        interactionRange = 1.5
    }
}
