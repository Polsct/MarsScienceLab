// Curiosity component part. Physicsless; mounted inside the
// rover model by ModuleCuriosityComponent, driven by the rover's ModuleCuriosityRig.
PART
{
    name = MSL_Curiosity_Wheel
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_Curiosity_Wheel_L
        scale = 1,1,1
    }
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_Curiosity_Wheel_R
        scale = 1,1,1
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 0
    TechRequired = experimentalScience
    entryCost = 0
    cost = 1000
    category = Ground
    subcategory = 0
    title = #MSL_Curiosity_MSL_Curiosity_Wheel_title
    manufacturer = #MSL_Curiosity_MSL_Curiosity_Wheel_manufacturer
    description = #MSL_Curiosity_MSL_Curiosity_Wheel_description
    tags = #MSL_Curiosity_MSL_Curiosity_Wheel_tags
    attachRules = 1,0,1,0,1
    bulkheadProfiles = srf
    mass = 0.0050
    PhysicsSignificance = 1
    crashTolerance = 8
    maxTemp = 1000
    breakingForce = 200
    breakingTorque = 200
    MODULE
    {
        name = ModulePartVariants
        baseVariant = Standard
        useMultipleDragCubes = false
        VARIANT
        {
            name = Standard
            displayName = #MSL_Curiosity_Wheel_Standard
            primaryColor = #a0a0a0
            secondaryColor = #303030
        }
        VARIANT
        {
            name = Mirrored
            displayName = #MSL_Curiosity_Wheel_Mirrored
            primaryColor = #a0a0a0
            secondaryColor = #707070
        }
    }
    MODULE
    {
        name = ModuleCuriosityComponent
        link = Wheel
        mountPosition = 0, 0, 0
        variantModels = Standard:MSL_Curiosity_Wheel_L,Mirrored:MSL_Curiosity_Wheel_R
        nodeVariants = WheelFL:Standard,WheelML:Standard,WheelRL:Standard,WheelFR:Mirrored,WheelMR:Mirrored,WheelRR:Mirrored
    }
}
