// MR-80B Mars Lander Engine, one of eight on the MSL descent stage. Part +Y = engine axis toward the BIP,
// thrustTransform at the nozzle exit. The part is the bare engine (injector flange, chamber, bell) that slides into the
// stage's flight shell; head, throttle valve and shell are stage hardware. Outboard (22.5 deg cant) and inboard
// (5.0 deg) variants share the model and only label the mount; ModuleMSLMLEMount picks the variant from the mount
// in the editor (mle1/3/5/7 outboard, mle2/4/6/8 inboard).
PART
{
    name = MSL_SC_MLE
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_SC_MLE
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 0
    node_stack_bottom = 0, 0, 0, 0, -1, 0, 0 // same mount point facing the other way: snaps onto a stage built either way up
    attachRules = 1,0,0,0,1
    PhysicsSignificance = 1 // the stage's rigid body carries mass and thrust (no joint flex in the aeroshell)
    TechRequired = advUnmanned
    entryCost = 4000
    cost = 800 // [GAME]
    category = Engine
    subcategory = 0
    title = #MSL_SkyCrane_MSL_SC_MLE_title
    manufacturer = #MSL_SkyCrane_MSL_SC_MLE_manufacturer
    description = #MSL_SkyCrane_MSL_SC_MLE_description
    mass = 0.0100 // VLC mass model: 8 MLEs 80.0 kg
    dragModelType = default
    maximum_drag = 0.02
    minimum_drag = 0.02
    angularDrag = 0.5
    crashTolerance = 10 // [GAME]
    maxTemp = 1600 // [GAME]
    skinMaxTemp = 1800 // [GAME]
    fuelCrossFeed = True
    bulkheadProfiles = srf
    tags = #MSL_SkyCrane_MSL_SC_MLE_tags
    stagingIcon = LIQUID_ENGINE
    engineType = MR-80B // hook for RealismOverhaul's own MR-80B engine config (legacy MM pass); ignored without RO
    MODULE
    {
        name = ModulePartVariants
        // first module: the shipped craft save only this module's node, which KSP matches by index
        baseVariant = Outboard
        useMultipleDragCubes = false
        VARIANT
        {
            name = Outboard
            displayName = #MSL_SkyCrane_Outboard_22_5_deg_cant
            primaryColor = #b0a070
            secondaryColor = #303030
        }
        VARIANT
        {
            name = Inboard
            displayName = #MSL_SkyCrane_Inboard_5_0_deg_cant
            primaryColor = #b0a070
            secondaryColor = #707070
        }
    }
    MODULE
    {
        name = ModuleEnginesFX
        engineID = MLE
        thrustVectorTransformName = thrustTransform
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 0.031 // 31 N demonstrated minimum (Aerojet qualification)
        maxThrust = 3.300 // 3300 N usable maximum
        heatProduction = 40 // [GAME]
        useEngineResponseTime = True
        engineAccelerationSpeed = 4.0 // [GAME] throttle slew
        engineDecelerationSpeed = 4.0 // [GAME]
        allowShutdown = True
        throttleLocked = False
        runningEffectName = running
        PROPELLANT
        {
            name = MonoPropellant
            ratio = 1
            DrawGauge = True
            resourceFlowMode = STAGE_PRIORITY_FLOW // the tanks are sibling parts on the stage, not on the engine's stack
        }
        atmosphereCurve
        {
            key = 0 223 // vacuum Isp, high throttle (demonstrated 204-223 s)
            key = 0.02 220 // Mars surface ~0.006 atm: negligible loss [GAME]
            key = 1 120 // [GAME] not relevant on Mars
        }
    }
    MODULE
    {
        name = ModuleMSLMLEMount // editor: sets the part variant from the stage node the engine is attached to
        mountVariants = mle1:Outboard,mle2:Inboard,mle3:Outboard,mle4:Inboard,mle5:Outboard,mle6:Inboard,mle7:Outboard,mle8:Inboard
    }
    MODULE
    {
        name = ModuleMSLComponentMount // editor: locks the measured pose on attach (rotate / offset undone)
        parentPart = MSL_SkyCrane
        mounts = mle1:-0.195090 0.000000 0.000000 0.980785, mle2:-0.043619 0.000000 0.000000 0.999048, mle3:0.000000 -0.980785 -0.195090 0.000000, mle4:0.000000 -0.999048 -0.043619 0.000000, mle5:-0.195090 0.000000 0.000000 0.980785, mle6:-0.043619 0.000000 0.000000 0.999048, mle7:0.000000 -0.980785 -0.195090 0.000000, mle8:0.000000 -0.999048 -0.043619 0.000000
    }
    EFFECTS
    {
        running
        {
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/Monoprop_big
                transformName = thrustTransform
                emission = 0.0 0.0
                emission = 0.05 0.15
                emission = 1.0 0.6
                speed = 0.0 0.6
                speed = 1.0 1.2
            }
        }
    }
}
