// MSL descent stage hydrazine tank (x3): titanium sphere with elastomeric diaphragm, flight blanket.
PART
{
    name = MSL_SC_PropTank
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_SC_PropTank
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, -0.3840, 0, 0, 1, 0, 0 // bottom outlet, where the feed line leaves the pole
    node_stack_bottom = 0, -0.3840, 0, 0, -1, 0, 0 // same mount point facing the other way: snaps onto a stage built either way up
    attachRules = 1,0,0,0,1
    PhysicsSignificance = 1
    TechRequired = advUnmanned
    entryCost = 1500
    cost = 400 // [GAME]
    category = FuelTank
    subcategory = 0
    title = #MSL_SkyCrane_MSL_SC_PropTank_title
    manufacturer = #MSL_SkyCrane_MSL_SkyCrane_manufacturer
    description = #MSL_SkyCrane_MSL_SC_PropTank_description
    mass = 0.01993 // 3 full fuel tanks 459.8 kg - 400 kg propellant, per tank
    dragModelType = default
    maximum_drag = 0.05
    minimum_drag = 0.05
    angularDrag = 0.5
    crashTolerance = 8 // [GAME]
    maxTemp = 1000 // [GAME]
    fuelCrossFeed = True
    bulkheadProfiles = srf
    tags = #MSL_SkyCrane_MSL_SC_PropTank_tags
    MODULE
    {
        name = ModuleMSLComponentMount // editor: locks the measured pose on attach (rotate / offset undone)
        parentPart = MSL_SkyCrane
        mounts = tank1:0.000000 0.000000 0.000000 1.000000, tank2:-0.000000 -0.866025 -0.000000 0.500000, tank3:0.000000 0.866025 0.000000 0.500000
    }
    RESOURCE
    {
        name = MonoPropellant
        amount = 33.3333
        maxAmount = 33.3333 // 133.3 kg at stock 4 kg/unit
    }
}
