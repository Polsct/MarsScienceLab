// MSL descent stage (Sky Crane) structure, 1:1. Frame: part +Y = BIP (backshell) side, -Y = rover side.
// Engines and propellant tanks are the separate parts
// MSL_SC_MLE / MSL_SC_PropTank / MSL_SC_RCS on the nodes below (Ships/VAB/MSL_Guided_Entry.craft).
PART
{
    name = MSL_SkyCrane
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_SkyCrane
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 2              // BIP interface plane: MSL_Backshell 'payload' node
    node_stack_bottom = 0, -1.1981, 0, 0, -1, 0, 1   // rover interface (3 pyro bolts): MSL_Curiosity 'skycrane' node
    // component mounts: position and outward direction measured from the source engine / thruster / tank frames
    node_stack_mle1 = 0.9590, -0.9196, 1.2035, 0.0000, -0.9239, 0.3827, 0
    node_stack_mle2 = 0.7460, -0.9086, 1.3281, 0.0000, -0.9962, 0.0872, 0
    node_stack_mle3 = 0.9590, -0.9196, -1.2035, 0.0000, -0.9239, -0.3827, 0
    node_stack_mle4 = 0.7460, -0.9086, -1.3281, 0.0000, -0.9962, -0.0872, 0
    node_stack_mle5 = -0.9590, -0.9196, 1.2035, 0.0000, -0.9239, 0.3827, 0
    node_stack_mle6 = -0.7460, -0.9086, 1.3281, 0.0000, -0.9962, 0.0872, 0
    node_stack_mle7 = -0.9590, -0.9196, -1.2035, 0.0000, -0.9239, -0.3827, 0
    node_stack_mle8 = -0.7460, -0.9086, -1.3281, 0.0000, -0.9962, -0.0872, 0
    node_stack_tank1 = 0.6026, -0.8090, 0.0000, 0.0000, -1.0000, 0.0000, 0
    node_stack_tank2 = -0.3013, -0.8090, 0.5219, 0.0000, -1.0000, 0.0000, 0
    node_stack_tank3 = -0.3013, -0.8090, -0.5219, 0.0000, -1.0000, 0.0000, 0
    node_stack_rcsFL = 0.8565, -0.2812, 0.9821, -0.3354, -0.8572, -0.3908, 0
    node_stack_rcsFR = 0.8565, -0.2812, -0.9821, -0.3354, -0.8572, 0.3908, 0
    node_stack_rcsAL = -0.8565, -0.2812, 0.9821, 0.3354, -0.8572, -0.3908, 0
    node_stack_rcsAR = -0.8565, -0.2812, -0.9821, 0.3354, -0.8572, 0.3908, 0
    TechRequired = advUnmanned
    entryCost = 24000
    cost = 12000 // [GAME]
    category = Structural
    subcategory = 0
    title = #MSL_SkyCrane_MSL_SkyCrane_title
    manufacturer = #MSL_SkyCrane_MSL_SkyCrane_manufacturer
    description = #MSL_SkyCrane_MSL_SkyCrane_description
    attachRules = 1,0,1,1,0
    mass = 0.5691 // VLC 'descent stage 581.7 kg' (excl. MLEs and full tanks) less the four MSL_SC_RCS pairs
    CoMOffset = 0.063, -0.544, 0.006 // ESTIMATE: whole stage incl. physicsless engines and full tanks
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 10 // [GAME]
    breakingForce = 400 // [GAME]
    breakingTorque = 400 // [GAME]
    maxTemp = 1200 // [GAME]
    skinMaxTemp = 1500 // [GAME]
    emissiveConstant = 0.6 // [GAME] MLI blankets
    fuelCrossFeed = True
    bulkheadProfiles = size2, size1
    tags = #MSL_SkyCrane_MSL_SkyCrane_tags
    vesselType = Lander
    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 // [GAME]
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3 // [GAME] full stock SAS: stability, pro/retro, normal/radial, target, maneuver
    }
    MODULE
    {
        name = ModuleMSLDescentControl
        engineID = MLE // the MSL_SC_MLE parts below this stage
        maxSplit = 0.85 // [GAME]
    }
    MODULE
    {
        name = ModuleDecouple
        ejectionForce = 0 // pyrotechnic bolts, the bridles carry the rover
        explosiveNodeID = bottom
        isOmniDecoupler = false
        menuName = #MSL_SkyCrane_Fire_rover_pyro_bolts
        stagingEnabled = False
    }
    MODULE
    {
        name = ModuleMSLBridle
        bridleLength = 7.50 // m
        payoutRate = 0.75 // m/s ESTIMATE
        umbilicalWidth = 0.0127 // m, 1/2 in umbilical
        umbilicalExtra = 0.30 // m longer than the bridles, ESTIMATE
    }
    MODULE
    {
        name = ModuleMSLPoweredDescent // automatic powered descent / sky crane / flyaway, armed at backshell separation
        skyCraneAgl = 21 // m
        skyCraneSpeed = 0.75 // m/s
        flyawayDistance = 650 // m, MSL stage crash distance
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 800 // [GAME] thermal batteries
        maxAmount = 800
    }
}
