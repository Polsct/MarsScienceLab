// Curiosity component part. Physicsless; mounted inside the
// rover model by ModuleCuriosityComponent, driven by the rover's ModuleCuriosityRig.
PART
{
    name = MSL_Curiosity_UHF
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_Curiosity_UHF
        scale = 1,1,1
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 0
    TechRequired = experimentalScience
    entryCost = 0
    cost = 1000
    category = Communication
    subcategory = 0
    title = #MSL_Curiosity_MSL_Curiosity_UHF_title
    manufacturer = #MSL_Curiosity_MSL_Curiosity_UHF_manufacturer
    description = #MSL_Curiosity_MSL_Curiosity_UHF_description
