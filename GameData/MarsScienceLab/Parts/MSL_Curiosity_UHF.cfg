    attachRules = 1,0,1,0,1
    bulkheadProfiles = srf
    mass = 0.0020
    PhysicsSignificance = 1
    crashTolerance = 8
    maxTemp = 1000
    breakingForce = 200
    breakingTorque = 200
    MODULE
    {
        name = ModuleCuriosityComponent
        link = 
        rover = MSL_Curiosity
        mountPosition = -1.08304179, 1.41620851, -0.504926682
    }
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 0.3
