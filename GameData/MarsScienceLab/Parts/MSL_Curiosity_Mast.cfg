// Curiosity component part. Physicsless; mounted inside the
// rover model by ModuleCuriosityComponent, driven by the rover's ModuleCuriosityRig.
PART
{
    name = MSL_Curiosity_Mast
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_Curiosity_Mast
        scale = 1,1,1
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0.715509236, 1.2254045, -0.558212399, 0, 1, 0, 0
    TechRequired = experimentalScience
    entryCost = 0
    cost = 1000
    category = Science
    subcategory = 0
    title = #MSL_Curiosity_MSL_Curiosity_Mast_title
    manufacturer = #MSL_Curiosity_MSL_Curiosity_Mast_manufacturer
    description = #MSL_Curiosity_MSL_Curiosity_Mast_description
    tags = #MSL_Curiosity_MSL_Curiosity_Mast_tags
    attachRules = 1,0,1,0,1
    bulkheadProfiles = srf
    mass = 0.0140
    PhysicsSignificance = 1
    crashTolerance = 8
    maxTemp = 1000
    breakingForce = 200
    breakingTorque = 200
    MODULE
    {
        name = ModuleCuriosityComponent
        link = Mast_Fold
        rover = MSL_Curiosity
        mountPosition = 0, 0, 0
    }
    MODULE
    {
        name = ModuleCuriosityExperiment
        experimentID = MSL_ChemCam
        requires = mast
        experimentActionName = #MSL_Curiosity_ChemCam_spectroscopy
        resetActionName = #MSL_Curiosity_Reset_MSL_ChemCam
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        xmitDataScalar = 0.5
        dataIsCollectable = True
        collectActionName = #MSL_Curiosity_Collect_data
        rerunnable = True
        interactionRange = 1.5
    }
    MODULE
    {
        name = ModuleCuriosityExperiment
        experimentID = MSL_Mastcam
        requires = mast
        experimentActionName = #MSL_Curiosity_Mastcam_geology_imaging
        resetActionName = #MSL_Curiosity_Reset_MSL_Mastcam
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        xmitDataScalar = 0.5
        dataIsCollectable = True
        collectActionName = #MSL_Curiosity_Collect_data
        rerunnable = True
        interactionRange = 1.5
    }
}
