// MSL descent stage RCS thruster pair (x4, on the outriggers): grey disc with two scarfed 250 N hydrazine
// thrusters, nozzles up through the backshell openings. Part frame: +Y = out of the disc face (exhausts), -Y onto
// the stage bracket; origin on the disc back face. Locked pose: ModuleMSLComponentMount puts each pair at its
// measured position and rotation on the stage node and undoes the editor's rotate / offset tools.
// The FL / AR discs are the mirror images of FR / AL (disc 8.4 mm off the thruster midpoint, to opposite sides):
// variants FL_AR / FR_AL, picked from the node by ModuleMSLMLEMount; the thrusters coincide, so the two
// rcsTransforms are shared, and ModuleMSLMLEMount turns them to the hand's lean (mirrored along the spacing).
PART
{
    name = MSL_SC_RCS
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_SC_RCS
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 0
    node_stack_bottom = 0, 0, 0, 0, -1, 0, 0 // same mount point facing the other way: snaps onto a stage built either way up
    attachRules = 1,0,0,0,1
    PhysicsSignificance = 1 // the stage's rigid body carries mass and thrust
    TechRequired = advUnmanned
    entryCost = 1500
    cost = 300 // [GAME]
    category = Control
    subcategory = 0
    title = #MSL_SkyCrane_MSL_SC_RCS_title
    manufacturer = #MSL_SkyCrane_MSL_SC_MLE_manufacturer
    description = #MSL_SkyCrane_MSL_SC_RCS_description
    mass = 0.0032 // 2 x 1.38 kg MR-107U + 0.40 kg disc/box (estimate)
    dragModelType = default
    maximum_drag = 0.01
    minimum_drag = 0.01
    angularDrag = 0.2
    crashTolerance = 10 // [GAME]
    maxTemp = 1600 // [GAME]
    skinMaxTemp = 1800 // [GAME]
    fuelCrossFeed = True
    bulkheadProfiles = srf
    tags = #MSL_SkyCrane_MSL_SC_RCS_tags
    rcsNoStage = True // RealismOverhaul: keep the RCS armed (not a staging item), so SAS has its actuators from launch
    MODULE
    {
        name = ModulePartVariants
        // first module: the shipped craft save only this module's node, which KSP matches by index
        baseVariant = FL_AR
        useMultipleDragCubes = false
        VARIANT
        {
            name = FL_AR
            displayName = #MSL_SkyCrane_RCS_FL_AR
            primaryColor = #a0a0a0
            secondaryColor = #303030
            GAMEOBJECTS
            {
                FL_AR = true
                FR_AL = false
            }
        }
        VARIANT
        {
            name = FR_AL
            displayName = #MSL_SkyCrane_RCS_FR_AL
            primaryColor = #a0a0a0
            secondaryColor = #707070
            GAMEOBJECTS
            {
                FL_AR = false
                FR_AL = true
            }
        }
    }
    MODULE
    {
        name = ModuleRCSFX // the pair's two thrusters, one rcsTransform each (shared by both variants, posed per variant below)
        stagingEnabled = False
        rcsEnabled = True // armed; fires when the vessel's RCS group is on
        shieldedCanThrust = True // fires through openings in the backshell
        thrusterTransformName = rcsTransform
        thrusterPower = 0.250 // kN per thruster
        useZaxis = True
        resourceName = MonoPropellant
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = rcs
        atmosphereCurve
        {
            key = 0 226 // MR-107U, interpolated at 250 N
            key = 1 100
        }
    }
    MODULE
    {
        name = ModuleMSLMLEMount // editor: sets the part variant from the stage node the pair is attached to
        mountVariants = rcsFL:FL_AR,rcsFR:FR_AL,rcsAL:FR_AL,rcsAR:FL_AR
        poseTransform = rcsTransform // and turns the shared thrusters to the selected hand's lean
        variantPoses = FL_AR:-0.047403 0.024352 -0.020225 0.689858 -0.595480 -0.155293 -0.381293;0.041241 0.024970 0.013078 0.689858 -0.595480 -0.155293 -0.381293|FR_AL:-0.041241 0.024970 0.013078 0.595478 -0.689859 -0.381293 -0.155294;0.047403 0.024352 -0.020225 0.595478 -0.689859 -0.381293 -0.155294
    }
    MODULE
    {
        name = ModuleMSLComponentMount // editor: locks the measured pose on attach (rotate / offset undone)
        parentPart = MSL_SkyCrane
        mounts = rcsFL:0.251996 0.835114 0.088919 0.480808, rcsFR:-0.088918 0.480808 -0.251994 0.835114, rcsAL:0.251994 -0.835114 -0.088918 0.480808, rcsAR:-0.088919 -0.480808 0.251996 0.835114
    }
    EFFECTS
    {
        rcs
        {
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/Monoprop_small
                transformName = rcsTransform
                emission = 0.0 0.0
                emission = 0.1 0.0
                emission = 1.0 1.0
                speed = 0.0 0.8
                speed = 1.0 1.0
            }
        }
    }
}
