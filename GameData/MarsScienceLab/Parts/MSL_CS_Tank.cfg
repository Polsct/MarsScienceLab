// MSL cruise stage hydrazine tank (x2), 0.48 m titanium sphere in gold MLI.
PART
{
    name = MSL_CS_Tank
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_CS_Tank
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 0
    node_stack_bottom = 0, 0, 0, 0, -1, 0, 0 // same mount point facing the other way: snaps onto a stage built either way up
    attachRules = 1,0,0,0,1
    PhysicsSignificance = 1 // the stage's rigid body carries the mass
    TechRequired = advUnmanned
    entryCost = 1200
    cost = 300 // [GAME]
    category = FuelTank
    subcategory = 0
    title = #MSL_CruiseStage_MSL_CS_Tank_title
    manufacturer = #MSL_CruiseStage_MSL_CS_Tank_manufacturer
    description = #MSL_CruiseStage_MSL_CS_Tank_description
    mass = 0.0060 // estimate
    dragModelType = default
    maximum_drag = 0.05
    minimum_drag = 0.05
    angularDrag = 0.5
    crashTolerance = 8
    maxTemp = 1000 // [GAME]
    fuelCrossFeed = True
    bulkheadProfiles = srf
    tags = #MSL_CruiseStage_MSL_CS_Tank_tags
    MODULE
    {
        name = ModuleMSLComponentMount // editor: sets the measured roll on attach
        parentPart = MSL_CruiseStage
        mounts = tank1:0.000000 -0.707107 0.000000 0.707107, tank2:0.000000 0.707107 0.000000 0.707107
    }
    RESOURCE
    {
        name = MonoPropellant
        amount = 8.7500
        maxAmount = 8.7500 // stock 0.004t/unit => 35kg
    }
}
