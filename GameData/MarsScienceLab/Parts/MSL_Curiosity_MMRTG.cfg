// Curiosity component part. Physicsless; mounted inside the
// rover model by ModuleCuriosityComponent, driven by the rover's ModuleCuriosityRig.
PART
{
    name = MSL_Curiosity_MMRTG
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_Curiosity_MMRTG
        scale = 1,1,1
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 0
    TechRequired = experimentalScience
    entryCost = 0
    cost = 1000
    category = Electrical
    subcategory = 0
    title = #MSL_Curiosity_MSL_Curiosity_MMRTG_title
    manufacturer = #MSL_Curiosity_MSL_Curiosity_MMRTG_manufacturer
    description = #MSL_Curiosity_MSL_Curiosity_MMRTG_description
    tags = #MSL_Curiosity_MSL_Curiosity_MMRTG_tags
    attachRules = 1,0,1,0,1
    bulkheadProfiles = srf
    mass = 0.0450
    PhysicsSignificance = 1
    crashTolerance = 8
    maxTemp = 1000
    breakingForce = 200
    breakingTorque = 200
    MODULE
    {
        name = ModuleCuriosityComponent
        link = 
        rover = MSL_Curiosity
        mountPosition = -1.20798102, 0.752814531, -1.93715096e-07
    }
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = true
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 0.110
        }
    }
    MODULE
    {
        name = ModuleCuriosityRTG
        halfLifeYears = 14.1 // electrical output, about 4.8 % a year (Pu-238 decay + thermocouple degradation)
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 2200
        maxAmount = 2200
    }
}
