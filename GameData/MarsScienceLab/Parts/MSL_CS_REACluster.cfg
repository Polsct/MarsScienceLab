// MSL cruise stage thruster cluster: cross-plate head with four REAs (5 N hydrazine thrusters with dual valves), x2.
// One part per cluster; cluster 2 is cluster 1 turned 180 deg about the stage axis (REA 2/1/4/3
// on cluster 1 match 5/6/8/7 on cluster 2). The part is the whole head: cross plate with
// its bent tabs, heater pads, strut shelf, manifold, sensor box, REA feed lines; the tripod legs stay on the stage.
// Part +Y = radially inward to the stage mount, +Z = stage axis. rcsTransform x4 (+Y = exhaust); tcmForward / tcmReverse
// (+Z = exhaust) on the axial REAs only.
PART
{
    name = MSL_CS_REACluster
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_CS_REACluster
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, 0, 0, 0, 1, 0, 0
    node_stack_bottom = 0, 0, 0, 0, -1, 0, 0 // same mount point facing the other way: snaps onto a stage built either way up
    attachRules = 1,0,0,0,1
    PhysicsSignificance = 1
    TechRequired = advUnmanned
    entryCost = 2400
    cost = 240 // [GAME]
    category = Control
    subcategory = 0
    title = #MSL_CruiseStage_MSL_CS_REACluster_title
    manufacturer = #MSL_CruiseStage_MSL_CS_REA_manufacturer
    description = #MSL_CruiseStage_MSL_CS_REACluster_description
    mass = 0.00222 // 4 REAs + head (estimate)
    dragModelType = default
    maximum_drag = 0.02
    minimum_drag = 0.02
    angularDrag = 0.2
    crashTolerance = 8
    maxTemp = 1600 // [GAME]
    fuelCrossFeed = True
    bulkheadProfiles = srf
    tags = #MSL_CruiseStage_MSL_CS_REACluster_tags
    MODULE
    {
        name = ModuleMSLComponentMount // editor: sets the measured roll on attach
        parentPart = MSL_CruiseStage
        mounts = cluster1:-0.653281 0.270598 0.270598 0.653281, cluster2:0.270598 0.653281 0.653281 -0.270598
    }
    rcsNoStage = True // RealismOverhaul: keep the cruise RCS armed for SAS instead of making it a staging item
    MODULE
    {
        name = ModuleMSLCruiseRCS // ModuleRCSFX with the eight REAs of both clusters allocated together (no net force on turns)
        stagingEnabled = False
        thrusterTransformName = rcsTransform
        thrusterPower = 0.005 // kN = 5N nominal per REA; no dynamic blowdown model
        useZaxis = false
        resourceName = MonoPropellant
        resourceFlowMode = STAGE_PRIORITY_FLOW
        runningEffectName = running
        atmosphereCurve
        {
            key = 0 220 // [GAME] provisional Isp, not a recovered MSL acceptance value
            key = 1 80
        }
    }
    // TCM 2/5: exhaust sunward, pushes the stack towards the heat shield. Started and shut down by hand (part menu or action group), burn on the throttle; not staged.
    MODULE
    {
        name = ModuleEnginesFX
        engineID = TCMForward
        thrustVectorTransformName = tcmForward
        throttleLocked = False
        stagingEnabled = False
        stagingToggleEnabledEditor = True
        exhaustDamage = False
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 0.005 // kN: one 5 N REA
        heatProduction = 1
        allowShutdown = True
        allowRestart = True
        EngineType = MonoProp
        powerEffectName = tcmForward
        PROPELLANT
        {
            name = MonoPropellant
            ratio = 1
            DrawGauge = True
            resourceFlowMode = STAGE_PRIORITY_FLOW
        }
        atmosphereCurve
        {
            key = 0 220 // [GAME] same provisional Isp as the RCS module
            key = 1 80
        }
    }
    // TCM 1/6: the opposite axial REA. Started and shut down by hand (part menu or action group), burn on the throttle; not staged.
    MODULE
    {
        name = ModuleEnginesFX
        engineID = TCMReverse
        thrustVectorTransformName = tcmReverse
        throttleLocked = False
        stagingEnabled = False
        stagingToggleEnabledEditor = True
        exhaustDamage = False
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 0.005 // kN: one 5 N REA
        heatProduction = 1
        allowShutdown = True
        allowRestart = True
        EngineType = MonoProp
        powerEffectName = tcmReverse
        PROPELLANT
        {
            name = MonoPropellant
            ratio = 1
            DrawGauge = True
            resourceFlowMode = STAGE_PRIORITY_FLOW
        }
        atmosphereCurve
        {
            key = 0 220 // [GAME] same provisional Isp as the RCS module
            key = 1 80
        }
    }
    EFFECTS
    {
        running
        {
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/Monoprop_small
                transformName = rcsTransform
                emission = 0.0 0.0
                emission = 1.0 0.15
                speed = 0.0 0.4
                speed = 1.0 0.6
                localRotation = -90, 0, 0
            }
        }
        tcmForward
        {
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/Monoprop_small
                transformName = tcmForward
                emission = 0.0 0.0
                emission = 0.05 0.05
                emission = 1.0 0.25
                speed = 0.0 0.5
                speed = 1.0 0.8
            }
        }
        tcmReverse
        {
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/Monoprop_small
                transformName = tcmReverse
                emission = 0.0 0.0
                emission = 0.05 0.05
                emission = 1.0 0.25
                speed = 0.0 0.5
                speed = 1.0 0.8
            }
        }
    }
}
