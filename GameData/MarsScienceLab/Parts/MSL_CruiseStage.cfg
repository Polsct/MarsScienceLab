// MSL cruise stage, 1:1 (SI). The 4.4 m envelope and small hardware are estimates.
// The two hydrazine tanks and the two four-REA thruster clusters are separate parts on the nodes below (MSL_CS_Tank, MSL_CS_REACluster).
PART
{
    name = MSL_CruiseStage
    module = Part
    author = Polsct
    MODEL
    {
        model = MarsScienceLab/Assets/MSL_CruiseStage
    }
    scale = 1
    rescaleFactor = 1
    node_stack_top = 0, -0.1400, 0, 0, 1, 0, 3  // backshell BIP plane: the stage sits down on the backshell
    node_stack_bottom = 0, -0.6735, 0, 0, -1, 0, 2
    // component mounts: position and outward direction measured from the source tank / REA frames
    node_stack_tank1 = 0.0000, -0.1157, 1.6330, -0.0000, -1.0000, -0.0000, 0
    node_stack_tank2 = -0.0000, -0.1157, -1.6330, -0.0000, -1.0000, -0.0000, 0
    node_stack_cluster1 = 1.4275, 0.3893, 1.4275, 0.0000, -1.0000, 0.0000, 0  // REA 2/1/4/3 (mount axis 0.7071, -0.0000, 0.7071; written down so a part held upright snaps)
    node_stack_cluster2 = -1.4275, 0.3893, -1.4275, 0.0000, -1.0000, 0.0000, 0  // REA 5/6/8/7 (mount axis -0.7071, -0.0000, -0.7071; written down so a part held upright snaps)
    TechRequired = advUnmanned
    entryCost = 18000
    cost = 9000 // [GAME]
    category = Control
    subcategory = 0
    title = #MSL_CruiseStage_MSL_CruiseStage_title
    manufacturer = #MSL_CruiseStage_MSL_CS_Tank_manufacturer
    description = #MSL_CruiseStage_MSL_CruiseStage_description
    attachRules = 1,0,1,1,0
    mass = 0.45356 // 540kg wet - 70kg fuel - tanks and REAs (estimate)
    CoMOffset = 0, -0.32, 0 // [GAME] estimate for the whole stage incl. physicsless tanks/REAs; not a measured flight CoM
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 8
    breakingForce = 2000
    breakingTorque = 2000
    maxTemp = 1200 // [GAME]
    emissiveConstant = 0.8 // [GAME], not a flight coating measurement
    fuelCrossFeed = True
    bulkheadProfiles = size3, size2
    tags = #MSL_CruiseStage_MSL_CruiseStage_tags
    stagingIcon = DECOUPLER_VERT
    fx_gasBurst_white = 0, 0, 0, 0, 1, 0, decouple
    sound_vent_large = decouple
    MODULE
    {
        name = ModuleDecouple
        ejectionForce = 0 // the separation nuts only release; the push comes from ModuleMSLPushoffSprings
        explosiveNodeID = top
        isOmniDecoupler = false
        menuName = #MSL_CruiseStage_Separate_Cruise_Stage
        stagingEnabled = True
    }
    MODULE
    {
        name = ModuleMSLPushoffSprings // three push-off springs on the backshell seats
        nodeID = top
        springForce = 0.5 // [GAME] kN per spring, fully compressed
        stroke = 0.05 // [GAME] m; 3 x 1/2 x 0.5 kN x 0.05 m = 37.5 J: ~0.4 m/s between the stage and a 3.3 t entry vehicle
        radius = 0.6700
        height = -0.1935
        azimuths = 90, 210, 330
    }
    MODULE
    {
        name = ModuleDeployableSolarPanel
        // Ring array, 6 panels, 12.8 m2 active GaInP/GaAs/Ge (Emcore),
        // ~2500 W if run at full capacity at Earth, >= 1080 W at the Mars approach even 43 deg off the sun.
        isTracking = false
        isBreakable = false
        // body-fixed array: isBreakable does not cover the collision check, and the stock 0.5 m/s impactResistance
        // broke it on the pad when the stack unpacks (0.46 m/s settle)
        impactResistance = 1000000
        impactResistanceRetracted = 1000000
        windResistance = 1000000
        raycastTransformName = sunCatcher
        secondaryTransformName = sunCatcher
        pivotName = sunCatcher
        resourceName = ElectricCharge
        chargeRate = 2.5 // kW at 1 AU, sun-normal, near-Earth cell temperature; RSS/RO convention 1EC = 1kJ
        // Cells give more power cold. [GAME] keyed on the cruise stage skin temperature: 1.0 at 240 K (1 AU, sun-normal),
        // 1.41 at 203 K (Mars approach, 43 deg off sun). Kerbalism ignores this curve.
        temperatureEfficCurve
        {
            key = 4 1.662 0 0
            key = 180 1.662 0 -0.01096
            key = 203 1.41 -0.01096 -0.01096
            key = 240.4 1 -0.01096 -0.01096
            key = 260 0.7852 -0.01096 -0.0045
            key = 400 0.42 -0.0012 -0.0012
            key = 1200 0.134 -0.00012 -0.00012
            key = 1900 0.02 -0.0000167 -0.0000167
            key = 2500 0.01 -0.0000167 -0.0000167
        }
        // Wear: RealismOverhaul SolarConfig level 7 (modern era) curve, days since launch: 0.986 after the
        // 254-day cruise, 0.80 after 10 years.
        timeEfficCurve
        {
            key = 0 1 -5.555555E-05 -5.555555E-05
            key = 3600 0.8 -4.129129E-05 -4.129129E-05
            key = 7300 0.7 -2.532859E-05 -2.532859E-05
            key = 36500 0.01 -2.363014E-05 -2.363014E-05
        }
    }
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        antennaPower = 200000000000 // [GAME] CommNet capability, not a radio link budget
        packetInterval = 0.4
        packetSize = 2
        packetResourceCost = 0.02
        requiredResource = ElectricCharge
        antennaCombinable = False
    }
    MODULE
    {
        name = ModuleCommand // probe core: the stage can hold and steer the stack in cruise (MSL flew on the rover's computer)
        minimumCrew = 0
        hasHibernation = True
        hibernationMultiplier = 0.004 // [GAME] stock probe-core value
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 // [GAME] same as the Sky Crane; power from the solar array and the rover battery
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3 // [GAME] full stock SAS, attitude held with the REA thrusters
    }
}
