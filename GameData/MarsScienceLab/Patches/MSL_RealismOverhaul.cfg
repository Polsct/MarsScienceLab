// RealismOverhaul compatibility
// Thermal values are RO's PICA-X template [GAME].  Ablation calibrated to MSL: the RSS entry at
// 5.8 km/s loses ~12 kg of the 153.5 kg PICA (MEDLI: recession < 2.54 mm).
@PART[MSL_HeatShield]:NEEDS[RealismOverhaul]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
	@maxTemp = 2400
	%skinMaxTemp = 3600
	%skinMassPerArea = 4
	%emissiveConstant = 0.6
	%thermalMassModifier = 1.0
	@MODULE[ModuleAblator]
	{
		@lossExp = -8000
		@lossConst = 1.000 // [GAME] calibrated
		@pyrolysisLossFactor = 4000 // x hsp 600 x 0.001 t = 2.4 MJ per kg ablated
		@ablationTempThresh = 500
		@reentryConductivity = 0.01
	}
}
// RO's global pass caps every part at 1073 K; restore the [GAME] limits of the base cfgs
@PART[MSL_Backshell]:NEEDS[RealismOverhaul]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
	@maxTemp = 2400
	%skinMaxTemp = 2000
}
@PART[MSL_CBMD|MSL_EBMD]:NEEDS[RealismOverhaul]:AFTER[RealismOverhaul]
{
	%RSSROConfig = True
	@maxTemp = 2000
	%skinMaxTemp = 2000
}
