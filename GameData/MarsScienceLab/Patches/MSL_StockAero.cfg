// Stock aerodynamics (no FAR). Stock aero applies drag at the part origin + CoPOffset and lift at origin + CoLOffset.
// The heat shield and backshell origins sit ahead of the entry CoM, so without offsets the capsule flips. The [GAME]
// offsets (this part's frame, +Y forward) trim at 11-12 deg, L/D 0.08-0.09; the backshell's drag goes to its aft
// cone. Skipped with FAR.
@PART[MSL_HeatShield]:NEEDS[!FerramAerospaceResearch]
{
	%CoPOffset = 0.0, -0.8, 0.0
	%CoLOffset = 0.0, 0.60, 0.0
	@MODULE[ModuleLiftingSurface]
	{
		@deflectionLiftCoeff = 19.44
	}
}
@PART[MSL_Backshell]:NEEDS[!FerramAerospaceResearch]
{
	%CoPOffset = 0.0, -1.0, 0.0
}
