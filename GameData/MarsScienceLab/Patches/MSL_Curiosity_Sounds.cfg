// Sounds for the rover. Only clips that ship with KSP; volumes and pitches are [GAME].
// Played by ModuleCuriosityRig (MSLCuriosity.dll): drive motors with the commanded wheel speed, arm / mast
// actuators with the fastest joint, the mobility deploy, and the drill while it runs.

@PART[MSL_Curiosity]:FINAL
{
    &EFFECTS {}
    @EFFECTS
    {
        mslDrive
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/elev_loop
                volume = 0.0 0.0
                volume = 0.05 0.15
                volume = 1.0 0.45
                pitch = 0.0 0.6
                pitch = 1.0 0.9
                loop = true
            }
        }
        mslServo
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_servomotor
                volume = 0.0 0.0
                volume = 0.1 0.15
                volume = 1.0 0.4
                pitch = 0.0 0.8
                pitch = 1.0 1.2
                loop = true
            }
        }
        mslDrill
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/sound_servomotor
                volume = 0.0 0.0
                volume = 1.0 0.5
                pitch = 0.0 1.8
                pitch = 1.0 2.2
                loop = true
            }
        }
    }
}
