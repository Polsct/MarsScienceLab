// Optional RealismOverhaul + RealFuels: hydrazine. Hydrazine density checked by validator
// against the installed resource definition. 70kg / 1.004kg per litre, 35 kg per tank.
@PART[MSL_CruiseStage|MSL_CS_Tank|MSL_CS_REACluster]:NEEDS[RealismOverhaul,RealFuels]:FOR[MarsScienceLab]
{
    %RSSROConfig = True
}
@PART[MSL_CS_Tank]:NEEDS[RealismOverhaul,RealFuels]:FOR[MarsScienceLab]
{
    !RESOURCE[MonoPropellant] {}
    MODULE
    {
        name = ModuleFuelTanks
        type = MSL_Hydrazine // hydrazine-only type, defined in MSL_SkyCrane_RO.cfg
        volume = 57.91 // 0.48 m sphere
        basemass = -1
        TANK
        {
            name = Hydrazine
            amount = 34.86055777
            maxAmount = 34.86055777
        }
    }
}
@PART[MSL_CS_REACluster]:NEEDS[RealismOverhaul,RealFuels]:FOR[MarsScienceLab]
{
    @MODULE[ModuleMSLCruiseRCS]
    {
        @resourceName = Hydrazine
        @thrusterPower = 0.005
    }
    @MODULE[ModuleEnginesFX],*
    {
        @PROPELLANT[MonoPropellant]
        {
            @name = Hydrazine
        }
    }
}
// RO sets every ModuleDeployable* to 0.5 m/s impact / 0.5 wind resistance (BEFORE[RealismOverhaul]); the body-fixed
// ring array then broke on the pad when the stack unpacked. Put the part's own values back after RO.
@PART[MSL_CruiseStage]:NEEDS[RealismOverhaul]:AFTER[RealismOverhaul]
{
    @MODULE[ModuleDeployableSolarPanel]
    {
        %impactResistance = 1000000
        %impactResistanceRetracted = 1000000
        %windResistance = 1000000
    }
}
// Waterfall through RO's ROWaterfall processor: attitude pulses on rcsTransform with the MSL MR-111C template
// (MSL_SkyCrane_Waterfall.cfg, sized in metres from the 6.8 mm exit; the RO generic RCS plume at 0.5 scale was
// several times wider than the nozzle).
@PART[MSL_CS_REACluster]:NEEDS[Waterfall,RealismOverhaul]:BEFORE[ROWaterfall]
{
    ROWaterfall
    {
        template = msl-rea-rcs
        controllerSet = rcs // RO assigns it only to rowaterfall-rcs-* names
        audio = rcs-jet-1
        transform = rcsTransform
        position = 0,0,0
        rotation = 0,0,0
        scale = 1,1,1
    }
}
// TCM burns: ROWaterfall only plumes the RCS module, so the TCM engines had no plume. One Waterfall module per
// engine, after ROWaterfall (it replaces the modules it finds), on the engine's thrust transform (+Z exhaust).
@PART[MSL_CS_REACluster]:NEEDS[Waterfall,RealismOverhaul]:AFTER[ROWaterfall]
{
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = MSL_TCMForward
        engineID = TCMForward
        useRelativeScaling = false
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }
        TEMPLATE
        {
            templateName = msl-rea-tcm
            overrideParentTransform = tcmForward
            position = 0,0,0
            rotation = 0,0,0
            scale = 1,1,1
        }
    }
    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = MSL_TCMReverse
        engineID = TCMReverse
        useRelativeScaling = false
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
        }
        TEMPLATE
        {
            templateName = msl-rea-tcm
            overrideParentTransform = tcmReverse
            position = 0,0,0
            rotation = 0,0,0
            scale = 1,1,1
        }
    }
}
