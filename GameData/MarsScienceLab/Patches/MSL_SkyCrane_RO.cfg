// Optional RealismOverhaul + RealFuels (+ TestFlight, Waterfall through RO).
//  * MSL_SC_MLE: RO's own MR-80B engine config (the part's engineType = MR-80B hook): RealFuels ModuleEngineConfigs, hydrazine
//    with helium pressurant (pressure-fed, ServiceModule tanks), 31-3603 N, Isp 223 s vac, 500 ignitions and,
//    with TestFlight/TestLite installed, its reliability data. RO sets the engine mass to 8.5 kg.
//  * MSL_SC_PropTank: RealFuels MSL_Hydrazine tank, 141.2 L internal (23 x 29 in capsule), 132.80 L hydrazine.
//  * MSL_SkyCrane: the two helium COPVs as an MSL_Helium tank of 146.5 L (outer diameter, ESTIMATE): helium for
//    the MR-80B feed (36 units per litre of hydrazine in RO's config).
//  * MSL_SC_RCS: the pair's two thrusters burn hydrazine.
// The stage and tanks keep their stock-derived masses (basemass = -1).
// Single-resource tank types: the hydrazine tanks hold only hydrazine, the COPVs only helium. RealFuels' fill button
// splits a tank by an engine's propellant ratios (MR-80B: hydrazine 1 : helium 36); a tank that cannot hold every
// propellant of a mixture does not offer it, so neither tank gets an MR-80B button and the hydrazine tanks fill
// through the RCS's 100 % hydrazine button. Masses and utilisation as ServiceModule.
TANK_DEFINITION:NEEDS[RealFuels]
{
    name = MSL_Hydrazine
    title = MSL Hydrazine
    description = MSL propellant tank: hydrazine only.
    highlyPressurized = True
    preserveResources = true
    basemass = 0.00003 * volume
    TANK
    {
        name = Hydrazine
        mass = 0.000081
        utilization = 1
        fillable = True
        amount = 0.0
        maxAmount = 0.0
        note = (pressurized)
    }
}
TANK_DEFINITION:NEEDS[RealFuels]
{
    name = MSL_Helium
    title = MSL Helium
    description = MSL pressurant tank (COPV): helium only.
    highlyPressurized = True
    preserveResources = true
    basemass = 0.00003 * volume
    TANK
    {
        name = Helium
        mass = 0.000115
        utilization = 200
        fillable = True
        amount = 0.0
        maxAmount = 0.0
        note = (pressurized)
    }
}
@PART[MSL_SC_MLE]:NEEDS[RealismOverhaul]:FOR[MarsScienceLab]
{
    %RSSROConfig = True
}
// The tanks hang on the stage beside the engines, so a stack search from an engine reaches only the stage
// itself (helium), never the hydrazine tanks.
// Draw every propellant of RO's MR-80B configs from the whole stage, as the stock config does.
@PART[MSL_SC_MLE]:NEEDS[RealismOverhaul]:AFTER[RealismOverhaulEngines]
{
    @MODULE[ModuleEngineConfigs],*
    {
        @CONFIG,*
        {
            @PROPELLANT,*
            {
                %resourceFlowMode = STAGE_PRIORITY_FLOW
            }
        }
    }
    @MODULE[ModuleEngines*],*
    {
        @PROPELLANT,*
        {
            %resourceFlowMode = STAGE_PRIORITY_FLOW
        }
    }
}
@PART[MSL_SC_PropTank]:NEEDS[RealismOverhaul,RealFuels]:FOR[MarsScienceLab]
{
    %RSSROConfig = True
    !RESOURCE[MonoPropellant] {}
    MODULE
    {
        name = ModuleFuelTanks
        type = MSL_Hydrazine
        volume = 141.23
        basemass = -1
        TANK
        {
            name = Hydrazine
            amount = 132.8021
            maxAmount = 132.8021
        }
    }
}
@PART[MSL_SkyCrane]:NEEDS[RealismOverhaul,RealFuels]:FOR[MarsScienceLab]
{
    %RSSROConfig = True
    MODULE
    {
        name = ModuleFuelTanks
        type = MSL_Helium
        volume = 146.46
        basemass = -1
        TANK
        {
            name = Helium
            amount = full
            maxAmount = 29292 // helium utilisation 200 (MSL_Helium, as ServiceModule)
        }
    }
}
@PART[MSL_SC_RCS]:NEEDS[RealismOverhaul,RealFuels]:FOR[MarsScienceLab]
{
    %RSSROConfig = True
    @MODULE[ModuleRCSFX]
    {
        @resourceName = Hydrazine
    }
}
// Waterfall plumes through RO's ROWaterfall processor, with the MSL templates of
// MSL_SkyCrane_Waterfall.cfg: sized in metres from the nozzle exits, rooted on the exit-plane transforms.
@PART[MSL_SC_MLE]:NEEDS[Waterfall,RealismOverhaul]:BEFORE[ROWaterfall]
{
    ROWaterfall
    {
        template = msl-mr80b-hydrazine
        controllerSet = atmo-thrust
        audio = pressure-fed-1
        engineID = MLE
        transform = thrustTransform
        position = 0,0,0
        rotation = 0,0,0
        scale = 1,1,1
    }
}
@PART[MSL_SC_RCS]:NEEDS[Waterfall,RealismOverhaul]:BEFORE[ROWaterfall]
{
    ROWaterfall
    {
        template = msl-rcs-hydrazine
        controllerSet = rcs // RO assigns it only to rowaterfall-rcs-* names
        audio = rcs-jet-1
        transform = rcsTransform
        position = 0,0,0
        rotation = 0,0,0
        scale = 1,1,1
    }
}
@PART[MSL_SkyCrane|MSL_SC_MLE|MSL_SC_PropTank|MSL_SC_RCS]:NEEDS[RealSolarSystem]:FINAL
{
    @rescaleFactor = 1
    @scale = 1
    !MODULE[TweakScale] {}
}
