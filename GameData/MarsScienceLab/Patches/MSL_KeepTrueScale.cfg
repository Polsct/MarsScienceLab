// With RealSolarSystem the aeroshell parts stay at true 1:1 size: this last pass undoes a rescale
// another mod applies to them (MSL_TweakScale.cfg removes TweakScale).
// Delete this file if you deliberately want to rescale the parts.
@PART[MSL_HeatShield|MSL_Backshell|MSL_CBMD|MSL_EBMD]:NEEDS[RealSolarSystem]:LAST[MarsScienceLab]
{
	@rescaleFactor = 1
	@scale = 1
}
