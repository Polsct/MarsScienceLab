// The MSL parts are modelled at true 1:1 size.  This guard runs last and undoes any
// global rescale or TweakScale patch another mod might apply to them.
// Delete this file if you deliberately want to rescale the parts.
@PART[MSL_HeatShield|MSL_Backshell|MSL_CBMD|MSL_EBMD]:NEEDS[RealSolarSystem]:FINAL
{
	@rescaleFactor = 1
	@scale = 1
	!MODULE[TweakScale] {}
}
