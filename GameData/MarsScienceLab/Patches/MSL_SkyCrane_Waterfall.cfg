// Waterfall plume templates for the MR-80B MLEs and the entry RCS.
EFFECTTEMPLATE:NEEDS[Waterfall]
{
    templateName = msl-mr80b-hydrazine
    EFFECT
    {
        name = core
        parentName = thrustTransform
        MODEL
        {
            path = Waterfall/FX/fx-cylinder
            positionOffset = 0,0,-0.0200
            rotationOffset = -90,0,0
            scaleOffset = 0.0918,1.6000,0.0918
            MATERIAL
            {
                transform = Cylinder
                shader = Waterfall/Additive (Dynamic)
                randomizeSeed = True
                COLOR
                {
                    colorName = _StartTint
                    colorValue = 1,0.94,0.86,1
                }
                COLOR
                {
                    colorName = _EndTint
                    colorValue = 0.72,0.78,0.92,1
                }
                FLOAT
                {
                    floatName = _Falloff
                    value = 3.6
                }
                FLOAT
                {
                    floatName = _Fresnel
                    value = 2.2
                }
                FLOAT
                {
                    floatName = _FresnelInvert
                    value = 0
                }
                FLOAT
                {
                    floatName = _Noise
                    value = 1.2
                }
                FLOAT
                {
                    floatName = _SpeedY
                    value = 60
                }
                FLOAT
                {
                    floatName = _TileX
                    value = 3
                }
                FLOAT
                {
                    floatName = _TintFalloff
                    value = 1.5
                }
                FLOAT
                {
                    floatName = _FadeIn
                    value = 0.01
                }
                FLOAT
                {
                    floatName = _FadeOut
                    value = 0.7
                }
            }
        }
        FLOATMODIFIER
        {
            name = brightness
            controllerName = throttle
            transformName = Cylinder
            combinationType = REPLACE
            useRandomness = False
            randomnessController = random
            randomnessScale = 1
            floatName = _Brightness
            floatCurve
            {
                key = 0 0 0 0
                key = 0.01 0.12 0 0
                key = 1 0.75 0 0
            }
        }
        FLOATMODIFIER
        {
            name = expand
