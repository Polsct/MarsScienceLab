// Textures Unlimited TU/Metallic materials for the MSL parts.
// Textures Unlimited is required; without it the parts fall back to plain KSP/Bumped albedo.
// _MetallicGlossMap/_AOMap: R metal, G AO, A smoothness.

KSP_MODEL_SHADER
{
    name = MSL_Aeroshell_MSL_AS_Parachute
    model = MarsScienceLab/Assets/MSL_AS_Parachute
    MATERIAL
    {
        mode = update
        shader = TU/Metallic
        // M_GRAPHITE: GRAPHITE
        textureScale = 16,16
        textureOffset = 0,0
        texture = _MetallicGlossMap, MarsScienceLab/Assets/GRAPHITE_ksp_t16x16_met
        texture = _AOMap, MarsScienceLab/Assets/GRAPHITE_ksp_t16x16_met
        mesh = BS_PCC_Lid_InnerFacesheet
        PROPERTY
        {
            name = _Metal
            float = 1
        }
        PROPERTY
        {
            name = _Smoothness
            float = 1
        }
    }
    MATERIAL
    {
        mode = update
        shader = TU/Metallic
        // M_ACUSIL: ACUSIL
        textureScale = 1,1
        textureOffset = 0,0
        texture = _MetallicGlossMap, MarsScienceLab/Assets/ACUSIL_ksp_met
        texture = _AOMap, MarsScienceLab/Assets/ACUSIL_ksp_met
        mesh = BS_PCC_Lid_TPS_AcusilII
        PROPERTY
        {
            name = _Metal
            float = 1
        }
        PROPERTY
        {
            name = _Smoothness
            float = 1
        }
    }
    MATERIAL
    {
        mode = update
        shader = TU/Metallic
        // M_AL: METAL
        textureScale = 1,1
        textureOffset = 0,0
        texture = _MetallicGlossMap, MarsScienceLab/Assets/METAL_ksp_met
        texture = _AOMap, MarsScienceLab/Assets/METAL_ksp_met
        mesh = BS_Mortar_Breech
        mesh = BS_Mortar_Canister
        PROPERTY
        {
            name = _Metal
            float = 1
        }
        PROPERTY
        {
            name = _Smoothness
            float = 1
        }
    }
    MATERIAL
    {
        mode = update
        shader = TU/Metallic
        // M_TITANIUM: METAL
        textureScale = 1,1
        textureOffset = 0,0
        texture = _MetallicGlossMap, MarsScienceLab/Assets/METAL_ksp_met
        texture = _AOMap, MarsScienceLab/Assets/METAL_ksp_met
        mesh = BS_Mortar_Initiators
        PROPERTY
        {
            name = _Metal
            float = 1
        }
        PROPERTY
        {
            name = _Smoothness
            float = 1
        }
    }
    MATERIAL
    {
        mode = update
        shader = TU/Metallic
        // M_BS_FASTENER: BS_FASTENER
        textureScale = 1,1
        textureOffset = 0,0
