// Textures Unlimited TU/Metallic materials for the MSL parts.
// Textures Unlimited is required; without it the parts fall back to plain KSP/Bumped albedo.
// _MetallicGlossMap/_AOMap: R metal, G AO, A smoothness.

KSP_MODEL_SHADER
{
    name = MSL_SkyCrane_MSL_SC_MLE
    model = MarsScienceLab/Assets/MSL_SC_MLE
    MATERIAL
    {
        mode = update
        shader = TU/Metallic
        // M_BRONZE: SC_THRUSTER_BRONZE
        textureScale = 10,10
        textureOffset = 0,0
        texture = _MetallicGlossMap, MarsScienceLab/Assets/SC_THRUSTER_BRONZE_ksp_met
        texture = _AOMap, MarsScienceLab/Assets/SC_THRUSTER_BRONZE_ksp_met
        mesh = M_BRONZE_0
        PROPERTY
        {
            name = _Metal
