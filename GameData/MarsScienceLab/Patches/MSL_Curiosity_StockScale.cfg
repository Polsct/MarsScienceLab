// Stock scale: the MSL_Curiosity parts at 0.625 x when RealSolarSystem is not installed.
// lengths x s (rescaleFactor scales models, colliders and nodes); masses, propellant, ablator, thrust,
// separation forces, areas and lift x s^2 (same ballistic coefficient, T/W, delta-v as 1:1); torques x s^3.
// Speeds, times, angles, electric charge, antennas and science are unchanged. With RSS the parts stay 1:1
// (the TrueScale patches, :NEEDS[RealSolarSystem]).

@PART[MSL_Curiosity|MSL_Curiosity_Arm|MSL_Curiosity_MMRTG|MSL_Curiosity_Mast|MSL_Curiosity_UHF|MSL_Curiosity_Wheel|MSL_Curiosity_XBand]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @rescaleFactor = 0.625
    @scale = 1
    !MODULE[TweakScale],* {}
    @mass *= 0.390625
    @RESOURCE[Ablator]
    {
        @amount *= 0.390625
        @maxAmount *= 0.390625
    }
    @RESOURCE[MonoPropellant]
    {
        @amount *= 0.390625
        @maxAmount *= 0.390625
    }
    @MODULE[ModuleDecouple],*
    {
        @ejectionForce *= 0.390625
    }
    @MODULE[ModuleAnchoredDecoupler],*
    {
        @ejectionForce *= 0.390625
    }
    @MODULE[ModuleEngines*],*
    {
        @maxThrust *= 0.390625
        @minThrust *= 0.390625
    }
    @MODULE[ModuleRCS*],*
    {
        @thrusterPower *= 0.390625
    }
    @MODULE[ModuleMSLCruiseRCS],*
    {
        @thrusterPower *= 0.390625
    }
    @MODULE[ModuleLiftingSurface],*
    {
        @deflectionLiftCoeff *= 0.390625
    }
}

@PART[MSL_Curiosity]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @CoMOffset = 0, 0.5625, 0
    @CoPOffset = 0, 0.5625, 0
    @CoLOffset = 0, 0.5625, 0
    @MODULE[ModuleCuriosityRig]
    {
        &wheelRadius = 0.25
        @wheelRadius *= 0.625
        &projectDistance = 0.005
        @projectDistance *= 0.625
        &armContactRange = 0.15
        @armContactRange *= 0.625
        &minDriveLinkMass = 0.025
        @minDriveLinkMass *= 0.390625
        &motorTorqueKNm = 0.2
        @motorTorqueKNm *= 0.244140625
        &brakeTorqueKNm = 0.6
        @brakeTorqueKNm *= 0.244140625
        &differentialStiffness = 50
        @differentialStiffness *= 0.244140625
        &differentialDamper = 2
        @differentialDamper *= 0.244140625
        &steerStiffness = 3
        @steerStiffness *= 0.244140625
        &steerDamper = 0.25
        @steerDamper *= 0.244140625
        @LINK,*
        {
            @mass *= 0.390625
        }
    }
}
