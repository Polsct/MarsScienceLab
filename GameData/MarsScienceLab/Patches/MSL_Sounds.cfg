// Sounds for the aeroshell. Only clips that ship with KSP; volumes and pitches are [GAME].
//
// Separations (heat shield, backshell, the eight balance masses) are pyrotechnic on MSL: the stock decoupler
// bang in place of a vent hiss. The mortar and the canopy are played by ModuleMSLEDLSequencer
// (MSLAeroshell.dll) whichever way the chute opens: automatic, part menu, staging or RealChute's own trigger.
// Last MSL pass (LAST[MarsScienceLab]) so the groups are there whatever other mods did to EFFECTS; player :FINAL patches still win.

@PART[MSL_HeatShield|MSL_CBMD|MSL_EBMD]:LAST[MarsScienceLab]
{
    !sound_vent_large = delete
    sound_decoupler_fire = decouple
}

@PART[MSL_Backshell]:LAST[MarsScienceLab]
{
    !sound_vent_large = delete
    sound_decoupler_fire = decouple
    &EFFECTS {}
    @EFFECTS
    {
        mslMortar
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/fireworks_launch_boom
                volume = 1.0
                pitch = 0.7
                loop = false
            }
        }
        // line stretch and inflation, preDeploymentSpeed after the mortar
        mslChuteInflate
        {
            AUDIO
            {
                channel = Ship
                clip = sound_parachute_open
                volume = 1.0
                pitch = 0.8
                loop = false
            }
        }
    }
}
