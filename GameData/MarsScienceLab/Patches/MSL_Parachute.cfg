// MSL disk-gap-band parachute
// RealChute when installed, otherwise ModuleMSLParachute (MSLAeroshell.dll) with the same numbers.
// D0 21.35 m; CD0 0.624 on S0 = 358.00 m2, line stretch 1.135 s,
// inflation 0.635 s. Canopy model MSL_Parachute.mu at true size:
// 80 gores, band 2.580 m, gap 0.904 m, inflated diameter 14.944 m, 36.578 m lines.
MATERIAL:NEEDS[RealChute]
{
	name = MSL_DGB
	description = #MSL_Aeroshell_MSL_disk_gap_band_canopy_drag_coefficient_flight_reconstructed_CD0_on_S0
	areaDensity = 0.000160614 // pack mass 57.5 kg / S0: RealChute canopy mass = flown pack
	dragCoefficient = 0.624
	areaCost = 0.075
	maxTemp = 493.15 // [GAME] RealChute nylon value
	specificHeat = 1700
	emissivity = 0.72
}
// On the parachute part (PCC lid + mortar, a physical part on the backshell node 'mortar'): the canopy load goes
// through that joint into the backshell, and the pack mass sits at the mortar.
// canopy model, risers and message: the same with either parachute module
@PART[MSL_AS_Parachute]
{
	MODULE
	{
		name = ModuleMSLParachuteRisers
		canopyName = MSL_DGB_canopy
		fittingZ = 1.349 // confluence fitting aft of the parachute cone
	}
	MODULE
	{
		name = ModuleMSLParachuteMessage
		canopyName = MSL_DGB_canopy
		// canopy atlas layout; the module only swaps fabric columns
		columns = 16
		diskWhite = 0
		diskOrange = 7
		splitOrangeWhite = 8
		splitWhiteOrange = 9
		bandWhite = 2
		bandOrange = 6
		vTile = 2.4000
		panel = 1.2000
		slant = 0.4500
		gores = 80
		firstPanel = 1
		ringPanels = 1
		diskRings = 3
		rings = 4
		ringChars = 8
	}
	MODULE
	{
		name = ModuleMSLParachuteLidFX // mortar fire: lid thrown out (visual copy), flash, smoke, recoil; canopy collapse cycle
		ejectSpeed = 39 // m/s, mortar muzzle velocity
		recoilDeltaV = 0.743 // m/s, aeroshell delta-v from the mortar
		firstPeakTime = 1.770 // s from mortar fire to the first peak force
	}
	MODEL
	{
		model = MarsScienceLab/Assets/MSL_Parachute
		position = 0, -0.5620, 0 // part frame: canopy anchor y -1.9325 in the backshell frame, mortar node y -1.3705
		rotation = 90, 0, 0 // canopy +Z aft; the parachute module re-aims it along -velocity once deployed
	}
}
@PART[MSL_AS_Parachute]:NEEDS[RealChute]
{
	MODULE
	{
		name = RealChuteModule
		caseMass = 0.0189 // lid + mortar (the part's mass); RealChute adds the canopy (pack) mass
		timer = 0
		mustGoDown = true
		cutSpeed = 0.5
		spareChutes = 0
		secondaryChute = false
		PARACHUTE
		{
			material = MSL_DGB
			capName = PCC_Lid
			parachuteName = MSL_DGB_canopy
			preDeploymentAnimation = MSL_DGB_line_stretch
			deploymentAnimation = MSL_DGB_inflate
			preDeployedDiameter = 3 // [GAME] bag and lines before line stretch
			deployedDiameter = 21.35 // D0
			minIsPressure = false
			minDeployment = 40000 // deploys on command: the flight software fires the mortar at ~405 m/s
			deploymentAlt = 40000
			cutAlt = -1
			preDeploymentSpeed = 1.135 // mortar fire to line stretch
			deploymentSpeed = 0.635 // line stretch to full inflation
			forcedOrientation = 0
		}
	}
}
// No RealChute: the same canopy, drag and timing through the plugin (not staged). Fire it from the part menu or an
// action group, or arm the auto mortar (speed trigger).
@PART[MSL_AS_Parachute]:NEEDS[!RealChute]
{
	MODULE
	{
		name = ModuleMSLParachute
		canopyName = MSL_DGB_canopy
		capName = PCC_Lid
		preDeploymentAnimation = MSL_DGB_line_stretch
		deploymentAnimation = MSL_DGB_inflate
		preDeployedDiameter = 3 // [GAME] bag and lines before line stretch (as RealChute)
		deployedDiameter = 21.35 // D0
		dragCoefficient = 0.624 // CD0 on S0
		preDeploymentSpeed = 1.135 // mortar fire to line stretch
		deploymentSpeed = 0.635 // line stretch to full inflation
		packMass = 0.0575 // t, flown pack, as RealChute adds it
		packCost = 27
		cutSpeed = 0.5
		mustGoDown = true
	}
}
