// Sounds for the cruise stage. Only clips that ship with KSP; volumes and pitches are [GAME].
//
// REAs (MR-111C, 5 N): added in the MSL_CruiseStage pass, before ROWaterfall. With RealismOverhaul + Waterfall,
// ROWaterfall clears EFFECTS on the REA parts and adds its own rcs-jet-1 audio (MSL_CruiseStage_RO.cfg).
// Cruise separation: last MSL pass, the pyro bang of the stock decouplers in place of a vent hiss.

@PART[MSL_CS_REACluster]:FOR[MarsScienceLab]
{
    @EFFECTS
    {
        @running
        {
            AUDIO_MULTI_POOL
            {
                channel = Ship
                transformName = rcsTransform
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 0.1 0.0
                volume = 0.5 0.015
                volume = 1.0 0.05
                pitch = 0.0 1.0
                pitch = 1.0 1.6
                loop = true
            }
        }
        &tcmForward {}
        @tcmForward
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 0.05 0.03
                volume = 1.0 0.08
                pitch = 0.0 1.2
                pitch = 1.0 1.5
                loop = true
            }
        }
        &tcmReverse {}
        @tcmReverse
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 0.05 0.03
                volume = 1.0 0.08
                pitch = 0.0 1.2
                pitch = 1.0 1.5
                loop = true
            }
        }
    }
}

@PART[MSL_CruiseStage]:LAST[MarsScienceLab]
{
    !sound_vent_large = delete
    sound_decoupler_fire = decouple
}
