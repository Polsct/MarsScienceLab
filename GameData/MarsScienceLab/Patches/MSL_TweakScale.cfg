// TweakScale blacklist: MSL parts already size themselves to the planet pack, and a second scale would break nodes,
// bridle, mounts and EDL tuning. Any TweakScale module added to an MSL part is removed after every other patch.
@PART[MSL_*]:HAS[@MODULE[TweakScale]]:NEEDS[TweakScale]:LAST[MarsScienceLab]
{
	!MODULE[TweakScale],* {}
}
