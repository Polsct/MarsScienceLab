// Stock scale: the MSL_SkyCrane parts at 0.625 x when RealSolarSystem is not installed.
// lengths x s (rescaleFactor scales models, colliders and nodes); masses, propellant, ablator, thrust,
// separation forces, areas and lift x s^2 (same ballistic coefficient, T/W, delta-v as 1:1); torques x s^3.
// Speeds, times, angles, electric charge, antennas and science are unchanged. With RSS the parts stay 1:1
// (the TrueScale patches, :NEEDS[RealSolarSystem]).

@PART[MSL_SC_MLE|MSL_SC_PropTank|MSL_SC_RCS|MSL_SkyCrane]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @rescaleFactor = 0.625
    @scale = 1
    !MODULE[TweakScale],* {}
    @mass *= 0.390625
    @RESOURCE[Ablator]
    {
        @amount *= 0.390625
        @maxAmount *= 0.390625
    }
    @RESOURCE[MonoPropellant]
    {
        @amount *= 0.390625
        @maxAmount *= 0.390625
    }
    @MODULE[ModuleDecouple],*
    {
        @ejectionForce *= 0.390625
    }
    @MODULE[ModuleAnchoredDecoupler],*
    {
        @ejectionForce *= 0.390625
    }
    @MODULE[ModuleEngines*],*
    {
        @maxThrust *= 0.390625
        @minThrust *= 0.390625
    }
    @MODULE[ModuleRCS*],*
    {
        @thrusterPower *= 0.390625
    }
    @MODULE[ModuleMSLCruiseRCS],*
    {
        @thrusterPower *= 0.390625
    }
    @MODULE[ModuleLiftingSurface],*
    {
        @deflectionLiftCoeff *= 0.390625
    }
}

@PART[MSL_SkyCrane]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @CoMOffset = 0.04625, -0.34125, 0.00375
    @MODULE[ModuleMSLBridle]
    {
        &bridleLength = 7.5
        @bridleLength *= 0.625
        &lineWidth = 0.014
        @lineWidth *= 0.625
        &umbilicalWidth = 0.0127
        @umbilicalWidth *= 0.625
        &umbilicalExtra = 0.3
        @umbilicalExtra *= 0.625
        &curlRadius = 0.05
        @curlRadius *= 0.625
        &curlPitch = 0.3
        @curlPitch *= 0.625
        &spring = 120
        @spring *= 0.625
        &damper = 12
        @damper *= 0.494105884
    }
    @MODULE[ModuleMSLPoweredDescent]
    {
        &skyCraneAgl = 21
        @skyCraneAgl *= 0.625
    }
}
