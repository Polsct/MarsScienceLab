// FAR (when installed): voxelize the collision hulls, never the render meshes.
// FAR's heuristic would otherwise voxelize the dense render meshes (seconds per vessel); every part listed here
// ships convex aerodynamic hulls, so forcing them keeps the outer shape and drops the cost.
@PART[MSL_HeatShield|MSL_Backshell|MSL_CBMD|MSL_EBMD]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	@MODULE[GeometryPartModule]
	{
		%forceUseColliders = True
	}
}
// The DGB canopy (MSL_Parachute.mu) has no hull and the parachute module (RealChute, or ModuleMSLParachute
// without it) supplies its drag: keep it out of the voxels even if the backshell is ever switched back to meshes.
@PART[MSL_AS_Parachute]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	@MODULE[GeometryPartModule]
	{
		ignoreTransform = MSL_DGB_canopy
		ignoreTransform = DGB_Canopy
		ignoreTransform = DGB_Canopy_inside
	}
}
