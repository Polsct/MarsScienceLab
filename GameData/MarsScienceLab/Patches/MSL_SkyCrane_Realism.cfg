// Optional realism-mod integrations for the descent stage, guarded by :NEEDS.
// RealFuels / RealismOverhaul / TestFlight (MR-80B) / Waterfall: MSL_SkyCrane_RO.cfg.
//
// RealAntennas: the X-band SDST and the 104.7 W TWTA (50.2 dBm) on the DLGA, and the Electra-Lite UHF (> 8.5 W,
// 39.3 dBm) on the DUHF; they keep transmitting through the flyaway. Gains are estimates (DLGA ~5 dBi, UHF ~3 dBi).
@PART[MSL_SkyCrane]:NEEDS[RealAntennas]:BEFORE[RealAntennas]
{
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = X
        referenceGain = 5 // DLGA (estimate)
        referenceFrequency = 8400
        TxPower = 50.2 // dBm, TWTA
        MaxTxPower = 50.2
    }
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = UHF
        referenceGain = 3 // DUHF (estimate)
        referenceFrequency = 401
        TxPower = 39.3 // dBm, Electra-Lite
        MaxTxPower = 39.3
    }
}
// RealismOverhaul's RealAntennas patch sets the first antenna of every command part to UHF; put it back afterwards.
@PART[MSL_SkyCrane]:NEEDS[RealAntennas]:LAST[MarsScienceLab]
{
    @MODULE[ModuleRealAntenna],0
    {
        %RFBand = X
    }
}
