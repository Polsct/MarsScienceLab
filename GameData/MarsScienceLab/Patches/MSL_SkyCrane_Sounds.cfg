// Sounds for the descent stage. Only clips that ship with KSP (built-in names and Squad/Sounds),
// so the mod gains no audio files. Volumes and pitches are [GAME] by ear.
//
// Engines and RCS: with RealismOverhaul + Waterfall, ROWaterfall replaces EFFECTS with its own audio, so the sound is
// never doubled. Events (bridle, rover release) are :FINAL, played by ModuleMSLBridle and the stock decoupler.

// MR-80B x8, hydrazine, throttled 1-100 %: a low monoprop hiss. Eight play at once, so each is quiet.
@PART[MSL_SC_MLE]:FOR[MarsScienceLab]
{
    @EFFECTS
    {
        @running
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 0.02 0.12
                volume = 1.0 0.35
                pitch = 0.0 0.55
                pitch = 1.0 0.85
                loop = true
            }
        }
        engage
        {
            AUDIO
            {
                channel = Ship
                clip = sound_vent_soft
                volume = 0.6
                pitch = 1.5
                loop = false
            }
        }
        disengage
        {
            AUDIO
            {
                channel = Ship
                clip = sound_vent_soft
                volume = 0.4
                pitch = 2.0
                loop = false
            }
        }
        flameout
        {
            AUDIO
            {
                channel = Ship
                clip = sound_explosion_low
                volume = 0.6
                pitch = 2.0
                loop = false
            }
        }
    }
}

// RCS pairs (MSL_SC_RCS x4, two thrusters each): one pooled source per thruster, as the stock RCS blocks
@PART[MSL_SC_RCS]:FOR[MarsScienceLab]
{
    @EFFECTS
    {
        @rcs
        {
            AUDIO_MULTI_POOL
            {
                channel = Ship
                transformName = rcsTransform
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 0.1 0.0
                volume = 0.5 0.025
                volume = 1.0 0.1
                pitch = 0.0 0.75
                pitch = 1.0 1.5
                loop = true
            }
        }
    }
}

@PART[MSL_SkyCrane]:FINAL
{
    sound_decoupler_fire = decouple     // rover release (pyro bolts on the bottom node)
    &EFFECTS {}
    @EFFECTS
    {
        // bridle and umbilical deployment unit: the reel brakes start and stop, the payout hums while it runs
        mslBridleStart
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/elev_start
                volume = 0.7
                pitch = 0.8
                loop = false
            }
        }
        mslBridleReel
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/elev_loop
                volume = 0.0 0.0
                volume = 1.0 0.6
                pitch = 0.0 0.7
                pitch = 1.0 0.8
                loop = true
            }
        }
        mslBridleStop
        {
            AUDIO
            {
                channel = Ship
                clip = Squad/Sounds/elev_stop
                volume = 0.7
                pitch = 0.8
                loop = false
            }
        }
        // pyrotechnic bridle and umbilical cutters
        mslBridleCut
        {
            AUDIO
            {
                channel = Ship
                clip = sound_decoupler_fire
                volume = 0.6
                pitch = 1.6
                loop = false
            }
        }
    }
}
