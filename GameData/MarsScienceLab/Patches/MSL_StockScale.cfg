// Stock scale: the MSL_Aeroshell parts at 0.625 x when RealSolarSystem is not installed.
// lengths x s (rescaleFactor scales models, colliders and nodes); masses, propellant, ablator, thrust,
// separation forces, areas and lift x s^2 (same ballistic coefficient, T/W, delta-v as 1:1); torques x s^3.
// Speeds, times, angles, electric charge, antennas and science are unchanged. With RSS the parts stay 1:1
// (the TrueScale patches, :NEEDS[RealSolarSystem]).

@PART[MSL_AS_Parachute|MSL_Backshell|MSL_CBMD|MSL_EBMD|MSL_HeatShield]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @rescaleFactor = 0.625
    @scale = 1
    !MODULE[TweakScale],* {}
    @mass *= 0.390625
    @RESOURCE[Ablator]
    {
        @amount *= 0.390625
        @maxAmount *= 0.390625
    }
    @RESOURCE[MonoPropellant]
    {
        @amount *= 0.390625
        @maxAmount *= 0.390625
    }
    @MODULE[ModuleDecouple],*
    {
        @ejectionForce *= 0.390625
    }
    @MODULE[ModuleAnchoredDecoupler],*
    {
        @ejectionForce *= 0.390625
    }
    @MODULE[ModuleEngines*],*
    {
        @maxThrust *= 0.390625
        @minThrust *= 0.390625
    }
    @MODULE[ModuleRCS*],*
    {
        @thrusterPower *= 0.390625
    }
    @MODULE[ModuleMSLCruiseRCS],*
    {
        @thrusterPower *= 0.390625
    }
    @MODULE[ModuleLiftingSurface],*
    {
        @deflectionLiftCoeff *= 0.390625
    }
}

@PART[MSL_AS_Parachute]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @CoMOffset = -0.0016875, -0.152375, 0
    @MODULE[ModuleMSLParachute]
    {
        &preDeployedDiameter = 3
        @preDeployedDiameter *= 0.625
        &deployedDiameter = 21.35
        @deployedDiameter *= 0.625
        &packMass = 0.0575
        @packMass *= 0.390625
    }
    @MODULE[RealChuteModule]
    {
        @caseMass *= 0.390625
        @PARACHUTE,*
        {
            @preDeployedDiameter *= 0.625
            @deployedDiameter *= 0.625
        }
    }
}

@PART[MSL_Backshell]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @CoMOffset = -0.00025, -0.46875, -0.0241875
    @CoPOffset = 0, -0.625, 0
    @MODULE[ModuleMSLAeroshellShield]
    {
        @maxPayloadRadius *= 0.625
        @minPayloadY *= 0.625
        @maxPayloadY *= 0.625
        @sealRadius *= 0.625
        @hipY *= 0.625
        @hipRadius *= 0.625
        @bipY *= 0.625
        @bipRadius *= 0.625
        @wallMargin *= 0.625
    }
    @MODULE[ModuleMSLEntryGuidance]
    {
        &referenceArea = 15.904
        @referenceArea *= 0.390625
    }
}

@PART[MSL_CBMD]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @CoMOffset = 0, 0.012, 0.00025
    @MODULE[ModuleMSLComponentMount]
    {
        @snapRadius *= 0.625
    }
}

@PART[MSL_EBMD]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @CoMOffset = 0, 0.0545, 0
    @MODULE[ModuleMSLComponentMount]
    {
        @snapRadius *= 0.625
    }
}

@PART[MSL_HeatShield]:NEEDS[!RealSolarSystem]:LAST[MarsScienceLab]
{
    @CoMOffset = -0.0029375, 0.2288125, -0.0014375
    @CoPOffset = 0, -0.5, 0
    @CoLOffset = 0, 0.375, 0
    @MODULE[ModuleMSLShieldAero]
    {
        &referenceArea = 15.904
        @referenceArea *= 0.390625
    }
}
