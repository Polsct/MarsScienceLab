// Optional realism-mod integrations for the cruise stage, guarded by :NEEDS.
// RealFuels / RealismOverhaul / Waterfall: MSL_CruiseStage_RO.cfg.
//
// RealAntennas: the cruise MGA horn, driven by the descent-stage TWTA, 104.7 W RF = 50.2 dBm; peak gain ~18 dBi
// (ESTIMATE). Replaces the stock CommNet transmitter.
@PART[MSL_CruiseStage]:NEEDS[RealAntennas]:BEFORE[RealAntennas]
{
    !MODULE[ModuleDataTransmitter] {}
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = X
        referenceGain = 18 // MGA (ESTIMATE)
        referenceFrequency = 8400
        TxPower = 50.2 // dBm, TWTA on the descent stage
        MaxTxPower = 50.2
    }
}
// RealismOverhaul's RealAntennas patch sets the first antenna of every command part to UHF; put it back afterwards.
@PART[MSL_CruiseStage]:NEEDS[RealAntennas]:LAST[MarsScienceLab]
{
    @MODULE[ModuleRealAntenna],0
    {
        %RFBand = X
    }
}
