// Optional realism-mod integrations for the backshell. Guarded by :NEEDS, so nothing changes
// when the mod is absent. The other parts carry their own patches in their mods' Patches folders.
//
// RealAntennas, the MSL telecom antennas:
//   X-band   descent-stage TWTA 104.7 W RF = 50.2 dBm feeds MGA / PLGA / TLGA / DLGA.
//   UHF      Electra-Lite > 8.5 W RF (39.3 dBm) to PUHF / DUHF / RUHF.
//   ESTIMATE PLGA/TLGA ~7.5 dBi, UHF helices ~3 dBi.
@PART[MSL_Backshell]:NEEDS[RealAntennas]:BEFORE[RealAntennas]
{
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = X
        referenceGain = 7.5 // PLGA on the parachute cone (ESTIMATE)
        referenceFrequency = 8400
        TxPower = 50.2 // dBm, descent-stage TWTA
        MaxTxPower = 50.2
    }
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = UHF
        referenceGain = 3 // PUHF (ESTIMATE)
        referenceFrequency = 401
        TxPower = 39.3 // dBm, Electra-Lite
        MaxTxPower = 39.3
    }
}
