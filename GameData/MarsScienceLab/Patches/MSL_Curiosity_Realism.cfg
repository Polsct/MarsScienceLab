// Optional realism-mod integrations for the rover, guarded by :NEEDS. The batteries and MMRTG
// are on MSL_Curiosity_MMRTG and the radios on MSL_Curiosity_XBand / _UHF.
//
// RealismOverhaul: two 42 Ah lithium-ion batteries at the 28 V bus = 8467 kJ (1 EC = 1 kJ). The MMRTG keeps 110 W.
@PART[MSL_Curiosity_MMRTG]:NEEDS[RealismOverhaul]:FOR[MarsScienceLab]
{
    %RSSROConfig = True
    @RESOURCE[ElectricCharge]
    {
        @amount = 8467
        @maxAmount = 8467
    }
}
// The other rover parts are true-scale and need no RO changes; without the flag RO's zzzRealismOverhaul pass
// titles them "non RO - ..." in the editor.
@PART[MSL_Curiosity|MSL_Curiosity_Arm|MSL_Curiosity_Mast|MSL_Curiosity_UHF|MSL_Curiosity_XBand|MSL_Curiosity_Wheel]:NEEDS[RealismOverhaul]:FOR[MarsScienceLab]
{
    %RSSROConfig = True
}

// RealAntennas: rover SSPA 15 W = 41.8 dBm on the HGA (25.5 dBi) and the RLGA (~7.5 dBi, estimate); Electra-Lite
// UHF > 8.5 W (39.3 dBm) on the RUHF helix (~3 dBi, estimate) for the orbiter relay. Replaces the stock transmitter.
@PART[MSL_Curiosity_XBand]:NEEDS[RealAntennas]:BEFORE[RealAntennas]
{
    !MODULE[ModuleDataTransmitter] {}
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = X
        referenceGain = 25.5 // HGA transmit gain on boresight
        referenceFrequency = 8400
        TxPower = 41.8 // dBm, SSPA 15 W
        MaxTxPower = 41.8
    }
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = X
        referenceGain = 7.5 // RLGA (estimate)
        referenceFrequency = 8400
        TxPower = 41.8
        MaxTxPower = 41.8
    }
}
@PART[MSL_Curiosity_UHF]:NEEDS[RealAntennas]:BEFORE[RealAntennas]
{
    !MODULE[ModuleDataTransmitter] {}
    MODULE
    {
        name = ModuleRealAntenna
        RFBand = UHF
        referenceGain = 3 // RUHF (estimate)
        referenceFrequency = 401
        TxPower = 39.3 // dBm, Electra-Lite
        MaxTxPower = 39.3
    }
}
// RealAntennas gives every command part without an antenna a default one; the rover body talks through its X-band and UHF parts only, so it is taken off again.
@PART[MSL_Curiosity]:NEEDS[RealAntennas]:LAST[MarsScienceLab]
{
    !MODULE[ModuleRealAntenna],* {}
}

// Kerbalism, default profile: the MMRTG as a decaying radioisotope process, 110 W at landing (1 EC = 1 kJ), with the
// profile's generic _RTG half-life. Other profiles keep the stock ModuleGenerator.
@PART[MSL_Curiosity_MMRTG]:NEEDS[Kerbalism,ProfileDefault]:AFTER[KerbalismDefault]
{
    !MODULE[ModuleGenerator] {}
    !MODULE[ModuleCuriosityRTG] {} // the stock-generator decay; Kerbalism's process decays by itself
    MODULE
    {
        name = ProcessController
        resource = _RTG
        title = #MSL_Curiosity_MMRTG
        capacity = 0.110 // EC/s at landing (110 W)
        running = true
        toggle = false
    }
}
// Kerbalism with the RealismOverhaul profile: the same, on that profile's _RTG process.
@PART[MSL_Curiosity_MMRTG]:NEEDS[Kerbalism,ProfileRealismOverhaul]:AFTER[RP-0-Kerbalism]
{
    !MODULE[ModuleGenerator] {}
    !MODULE[ModuleCuriosityRTG] {} // the stock-generator decay; Kerbalism's process decays by itself
    MODULE
    {
        name = ProcessController
        resource = _RTG
        title = #MSL_Curiosity_MMRTG
        capacity = 0.110 // EC/s at landing (110 W)
        running = true
        toggle = false
    }
}
