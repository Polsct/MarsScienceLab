// RP-1 (Realistic Progression One, RO career) tech-tree placement.
// Without this file RP-1 tags every MSL part "non RP-0" and, with its NoNonRP0 option, hides them.
//
// Nodes follow where RP-1 puts the same hardware: largeRoverDesigns (with ROE-MR80B) unlocks the whole flight system,
// modernNuclearPower (with RO-MMRTG) the MMRTG. Costs are RP-1 funds [GAME], scaled to RP-1 parts of the same kind;
// entry costs: ENTRYCOSTMODS at the end of this file.
// AFTER[xxxRP0] runs after RP-1's tree placement and before its non-RP-0 sweep (FOR[zzzRP-0]).

@PART[MSL_*]:NEEDS[RP-1]:AFTER[xxxRP0]
{
    %TechRequired = largeRoverDesigns
    %RP0conf = true
}

@PART[MSL_Curiosity_MMRTG]:NEEDS[RP-1]:AFTER[xxxRP0]
{
    @TechRequired = modernNuclearPower
    %cost = 2500
}

// rover
@PART[MSL_Curiosity]:NEEDS[RP-1]:AFTER[xxxRP0]          { %cost = 5000 }
@PART[MSL_Curiosity_Arm]:NEEDS[RP-1]:AFTER[xxxRP0]      { %cost = 800 }
@PART[MSL_Curiosity_Mast]:NEEDS[RP-1]:AFTER[xxxRP0]     { %cost = 600 }
@PART[MSL_Curiosity_Wheel]:NEEDS[RP-1]:AFTER[xxxRP0]    { %cost = 250 }
@PART[MSL_Curiosity_UHF]:NEEDS[RP-1]:AFTER[xxxRP0]      { %cost = 100 }
@PART[MSL_Curiosity_XBand]:NEEDS[RP-1]:AFTER[xxxRP0]    { %cost = 150 }
// Sky Crane
@PART[MSL_SkyCrane]:NEEDS[RP-1]:AFTER[xxxRP0]           { %cost = 2500 }
@PART[MSL_SC_MLE]:NEEDS[RP-1]:AFTER[xxxRP0]             { %cost = 26 }
@PART[MSL_SC_PropTank]:NEEDS[RP-1]:AFTER[xxxRP0]        { %cost = 150 }
@PART[MSL_SC_RCS]:NEEDS[RP-1]:AFTER[xxxRP0]             { %cost = 20 }
// aeroshell
@PART[MSL_Backshell]:NEEDS[RP-1]:AFTER[xxxRP0]          { %cost = 2000 }
@PART[MSL_HeatShield]:NEEDS[RP-1]:AFTER[xxxRP0]         { %cost = 1500 }
@PART[MSL_AS_Parachute]:NEEDS[RP-1]:AFTER[xxxRP0]       { %cost = 400 }
@PART[MSL_CBMD|MSL_EBMD]:NEEDS[RP-1]:AFTER[xxxRP0]      { %cost = 1 }
// cruise stage
@PART[MSL_CruiseStage]:NEEDS[RP-1]:AFTER[xxxRP0]        { %cost = 1500 }
@PART[MSL_CS_REACluster]:NEEDS[RP-1]:AFTER[xxxRP0]      { %cost = 40 }
@PART[MSL_CS_Tank]:NEEDS[RP-1]:AFTER[xxxRP0]            { %cost = 150 }

// Entry (unlock) costs: RealFuels' entry-cost database only covers parts it lists. Names: "_" and "." become "-".
// "a = b" makes a cost what b costs and unlocks both together; "n, x, y" is n plus the shared unlocks x and y not yet paid.
@ENTRYCOSTMODS:NEEDS[RP-1]:AFTER[xxxRP-0]
{
    // rover: one development; the components only fit this rover and unlock with it
    MSL-Curiosity = 30000                    // [GAME] same order as the Sky Crane (24000) and cruise stage (18000)
    MSL-Curiosity-Arm = MSL-Curiosity
    MSL-Curiosity-Mast = MSL-Curiosity
    MSL-Curiosity-UHF = MSL-Curiosity
    MSL-Curiosity-XBand = MSL-Curiosity
    MSL-Curiosity-Wheel = MSL-Curiosity
    MSL-Curiosity-MMRTG = RO-MMRTG           // the same flight unit as RP-1's RO-MMRTG (50000 + RTGlevel5)
    // Sky Crane
    MSL-SkyCrane = 24000
    MSL-SC-MLE = 4000                        // as RP-1's ROE-MR80B
    MSL-SC-PropTank = 1500
    MSL-SC-RCS = 1500, rcsMult               // RP-1 RCS parts: n + rcsMult
    // aeroshell
    MSL-HeatShield = 12000, heatshieldsLifting   // guided lifting entry; RP-1 heat shields share heatshieldsLifting
    MSL-Backshell = 10000
    MSL-AS-Parachute = 2000
    MSL-CBMD = 600
    MSL-EBMD = MSL-CBMD
    // cruise stage
    MSL-CruiseStage = 18000
    MSL-CS-REACluster = 2400, rcsMult
    MSL-CS-Tank = 1200
}
