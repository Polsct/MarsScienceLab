// RCS and TCM audio, last pass, after ROWaterfall has put its rcs-jet-1 sound on the thrusters.
//
// ROWaterfall leaves the jet sound in an effect called "running"; the Sky Crane RCS pairs still fire "rcs", so point
// them at "running" (only where ROWaterfall made that swap). Volume: the stock curve is mute below 10 % power, but
// attitude hold pulses at a few per cent, so a soft hiss from 2 % up, rising to 0.4 at full power.

@PART[MSL_SC_RCS]:HAS[@EFFECTS:HAS[@running,!rcs]]:FINAL
{
    @MODULE[ModuleRCSFX]
    {
        @runningEffectName = running
    }
}

@PART[MSL_SC_RCS|MSL_CS_REACluster]:FINAL
{
    @EFFECTS
    {
        @running
        {
            @AUDIO_MULTI_POOL
            {
                !volume,* = delete
                volume = 0.0 0.0
                volume = 0.02 0.12
                volume = 0.25 0.25
                volume = 1.0 0.4
            }
        }
    }
}

// Without RealismOverhaul the Sky Crane RCS pairs keep their own "rcs" effect with the stock curve; same curve as above.
@PART[MSL_SC_RCS]:HAS[@EFFECTS:HAS[@rcs:HAS[@AUDIO_MULTI_POOL]]]:FINAL
{
    @EFFECTS
    {
        @rcs
        {
            @AUDIO_MULTI_POOL
            {
                !volume,* = delete
                volume = 0.0 0.0
                volume = 0.02 0.12
                volume = 0.25 0.25
                volume = 1.0 0.4
            }
        }
    }
}

// TCM burns under RealismOverhaul: ROWaterfall clears EFFECTS, so the TCM engines get a steady monoprop hiss here (only where missing).
@PART[MSL_CS_REACluster]:HAS[@EFFECTS:HAS[!tcmForward]]:FINAL
{
    @EFFECTS
    {
        tcmForward
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 0.05 0.15
                volume = 1.0 0.4
                pitch = 0.0 1.2
                pitch = 1.0 1.5
                loop = true
            }
        }
        tcmReverse
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_mini
                volume = 0.0 0.0
                volume = 0.05 0.15
                volume = 1.0 0.4
                pitch = 0.0 1.2
                pitch = 1.0 1.5
                loop = true
            }
        }
    }
}
